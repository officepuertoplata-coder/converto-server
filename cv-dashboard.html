<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Converdino – Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --g: #25D366; --g2: #128C7E; --dark: #1a2e24;
    --bg: #f0f4f2; --card: #fff; --border: #e2e8e4;
    --text: #1a2e24; --mu: #6b7e74; --red: #dc2626; --amber: #d97706;
    --r: 14px; --shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* NAV */
  nav { background: var(--dark); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
  .logo { color: #fff; font-weight: 900; font-size: 1.15rem; letter-spacing: -.5px; }
  .logo span { color: var(--g); }
  .nav-right { display: flex; align-items: center; gap: 14px; color: #fff; }
  .nav-user { font-size: .82rem; opacity: .7; }
  .nav-logout { background: rgba(255,255,255,.15); color: #fff; border: none; padding: 7px 14px; border-radius: 8px; font-family: inherit; font-weight: 800; font-size: .78rem; cursor: pointer; }
  .nav-logout:hover { background: rgba(255,255,255,.25); }

  /* MAIN */
  main { max-width: 1200px; margin: 0 auto; padding: 28px 16px 60px; }

  /* SUBSCRIPTION HEADER */
  .sub-header { background: var(--dark); color: #fff; border-radius: var(--r); padding: 22px 26px; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
  .sub-info { display: flex; align-items: center; gap: 14px; flex: 1; }
  .sub-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--g); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
  .sub-text { font-size: 1.1rem; font-weight: 900; }
  .sub-sub { font-size: .82rem; opacity: .75; margin-top: 2px; }
  .sub-stats { display: flex; align-items: center; gap: 12px; }
  .sub-count { background: rgba(255,255,255,.12); padding: 12px 18px; border-radius: 10px; text-align: center; }
  .sub-count-num { font-size: 1.6rem; font-weight: 900; line-height: 1; }
  .sub-count-lbl { font-size: .7rem; opacity: .75; margin-top: 4px; }

  /* SECTION TITLE */
  .section-label { font-size: .72rem; font-weight: 800; color: var(--mu); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

  /* SLOTS GRID */
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .slot { background: var(--card); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); position: relative; transition: transform .15s; }
  .slot-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .slot-num { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1rem; }
  .slot-badge { width: 28px; height: 28px; border-radius: 50%; background: var(--dark); color: #fff; font-size: .78rem; display: flex; align-items: center; justify-content: center; font-weight: 900; }
  .pill { font-size: .68rem; font-weight: 900; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: .5px; }
  .pill.empty { background: #f1f5f3; color: var(--mu); }
  .pill.configured { background: #dbeafe; color: #1d4ed8; }
  .pill.uploading { background: #fef3c7; color: var(--amber); }
  .pill.analyzing { background: #fef3c7; color: var(--amber); }
  .pill.active { background: #dcfce7; color: var(--g2); }

  .slot-body { min-height: 80px; display: flex; flex-direction: column; gap: 10px; }

  .empty-msg { color: var(--mu); font-size: .85rem; text-align: center; padding: 8px 0; }

  .article-card { background: #f8faf9; border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; }
  .article-title { font-weight: 900; font-size: .92rem; margin-bottom: 3px; }
  .article-meta { font-size: .75rem; color: var(--mu); }

  /* BUTTONS */
  .btn { width: 100%; padding: 11px 14px; border: none; border-radius: 10px; font-family: inherit; font-weight: 800; font-size: .85rem; cursor: pointer; transition: all .15s; }
  .btn-primary { background: var(--dark); color: #fff; }
  .btn-primary:hover { background: #0f1f17; }
  .btn-success { background: var(--g); color: #fff; }
  .btn-success:hover { background: var(--g2); }
  .btn-soft { background: #f1f5f3; color: var(--text); border: 1px solid var(--border); }
  .btn-soft:hover { background: #e8efea; }
  .btn-danger-soft { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; }
  .btn-danger-soft:hover { background: #fee2e2; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

  /* SPINNER */
  .spinner { width: 24px; height: 24px; border: 3px solid var(--g); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; margin: 8px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ACTIVE BOT INFO */
  .bot-info { background: linear-gradient(135deg, #f0fdf4, #ecfdf5); border: 1px solid #bbf7d0; border-radius: 10px; padding: 10px 12px; font-size: .78rem; color: var(--g2); font-weight: 700; word-break: break-all; }
  .bot-code { font-family: monospace; font-weight: 900; font-size: .85rem; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); border-radius: 16px; max-width: 500px; width: 100%; max-height: 92vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .modal-title { font-weight: 900; font-size: 1.05rem; }
  .modal-close { background: none; border: none; font-size: 1.4rem; color: var(--mu); cursor: pointer; }
  .modal-body { padding: 20px 22px; }
  .modal-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; }

  .field { margin-bottom: 14px; }
  .field-label { font-size: .72rem; font-weight: 800; color: var(--mu); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: .92rem; outline: none; background: #fff; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--g); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .err { color: var(--red); font-size: .8rem; font-weight: 700; margin-top: 8px; min-height: 18px; }

  /* TOAST */
  .toast { position: fixed; top: 72px; right: 16px; background: var(--dark); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: .85rem; font-weight: 800; z-index: 999; opacity: 0; transform: translateY(-8px); transition: all .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* COPY ANIM */
  .copied { background: var(--g) !important; color: #fff !important; }
</style>
</head>
<body>

<nav>
  <div class="logo">Conver<span>dino</span></div>
  <div class="nav-right">
    <span class="nav-user" id="navUser">admin</span>
    <button class="nav-logout" onclick="logout()">Ausloggen</button>
  </div>
</nav>

<main>
  <div id="app">
    <div style="text-align:center;padding:60px;color:var(--mu);">
      <div class="spinner"></div>
      Lade Dashboard...
    </div>
  </div>
</main>

<!-- MODAL: Artikel einrichten -->
<div class="modal-overlay" id="articleModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">📦 Artikel einrichten</div>
      <button class="modal-close" onclick="closeArticleModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <div class="field-label">Artikelbezeichnung *</div>
        <input id="f-title" type="text" placeholder="z.B. Peugeot Traveller 2018">
      </div>
      <div class="field-row">
        <div class="field">
          <div class="field-label">Verkaufspreis (€) *</div>
          <input id="f-price" type="number" min="0" step="0.01" placeholder="23990">
        </div>
        <div class="field">
          <div class="field-label">Mindestpreis (€) *</div>
          <input id="f-minprice" type="number" min="0" step="0.01" placeholder="22000">
        </div>
      </div>
      <div class="field">
        <div class="field-label">Standort</div>
        <input id="f-location" type="text" placeholder="Wien 22, Donaustadt">
      </div>
      <div class="field">
        <div class="field-label">Anrede im Bot</div>
        <select id="f-anrede">
          <option value="Sie">Sie (formell)</option>
          <option value="Du">Du (locker)</option>
        </select>
      </div>
      <div class="err" id="articleErr"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-soft" onclick="closeArticleModal()">Abbrechen</button>
      <button class="btn btn-success" id="saveArticleBtn" onclick="saveArticle()">Weiter → Fotos & Dokumente</button>
    </div>
  </div>
</div>

<!-- MODAL: Bot Assets (WA, QR, Widget) -->
<div class="modal-overlay" id="assetModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">🤖 Dein Bot ist aktiv</div>
      <button class="modal-close" onclick="closeAssetModal()">×</button>
    </div>
    <div class="modal-body" id="assetBody">
      <!-- gefüllt durch JS -->
    </div>
    <div class="modal-foot">
      <button class="btn btn-soft" style="flex:1" onclick="closeAssetModal()">Schließen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://converto-server-production.up.railway.app';
const AUTH_KEY = 'converto_auth_v2';

let auth = null;
let activeSlotId = null;

// ── AUTH PRÜFEN ──────────────────────────────────────
(function init() {
  try {
    auth = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
  } catch(e) { auth = null; }

  if (!auth || !auth.role) {
    // Für Schritt 3-Tests: erlaube admin-Bypass falls nicht eingeloggt
    auth = { role: 'admin', username: 'admin', name: 'admin' };
  }

  document.getElementById('navUser').textContent = auth.username || auth.name || 'admin';
  loadDashboard();
})();

function logout() {
  localStorage.removeItem(AUTH_KEY);
  location.href = 'login.html';
}

// ── DASHBOARD LADEN ──────────────────────────────────
async function loadDashboard() {
  const userLogin = auth.username || auth.name || 'admin';
  try {
    const r = await fetch(API + '/api/cv/me?user=' + encodeURIComponent(userLogin));
    const d = await r.json();
    render(d);
  } catch(e) {
    document.getElementById('app').innerHTML =
      '<div style="text-align:center;padding:60px;color:var(--red);">Verbindungsfehler: ' + esc(e.message) + '</div>';
  }
}

// ── RENDER ───────────────────────────────────────────
function render(d) {
  const app = document.getElementById('app');

  if (!d.active) {
    app.innerHTML = `
      <div style="text-align:center;padding:60px;background:var(--card);border-radius:var(--r);">
        <div style="font-size:3rem;margin-bottom:10px;">🤖</div>
        <h2 style="margin-bottom:8px;">Noch kein Abo aktiv</h2>
        <p style="color:var(--mu);font-size:.88rem;">
          Für dieses Konto existiert keine aktive Subscription.<br>
          Im Test-Modus wird der "admin" User mit 5 Slots automatisch angelegt.
        </p>
      </div>`;
    return;
  }

  const sub = d.subscription;
  const slots = d.slots || [];
  const periodEnd = sub.current_period_end
    ? new Date(sub.current_period_end).toLocaleDateString('de-AT', { day:'2-digit', month:'2-digit', year:'numeric' })
    : '—';

  let html = `
    <div class="sub-header">
      <div class="sub-info">
        <div class="sub-icon">✓</div>
        <div>
          <div class="sub-text">Abo aktiv</div>
          <div class="sub-sub">Verlängert am ${periodEnd} · ${sub.slots_used} von ${sub.slots_total} Slots belegt</div>
        </div>
      </div>
      <div class="sub-stats">
        <div class="sub-count">
          <div class="sub-count-num">${sub.slots_total}</div>
          <div class="sub-count-lbl">Slots gesamt</div>
        </div>
      </div>
    </div>

    <div class="section-label">Meine Bot-Slots</div>
    <div class="slots">`;

  for (const slot of slots) {
    html += renderSlot(slot);
  }

  html += '</div>';
  app.innerHTML = html;
}

function renderSlot(slot) {
  const pill = `<span class="pill ${slot.status}">${pillLabel(slot.status)}</span>`;
  let body = '';

  if (slot.status === 'empty' || !slot.article) {
    body = `
      <div class="empty-msg">Kein Artikel eingerichtet</div>
      <button class="btn btn-primary" onclick="openArticleModal('${slot.id}')">📦 Artikel einrichten</button>`;
  } else if (slot.status === 'configured') {
    body = `
      <div class="article-card">
        <div class="article-title">${esc(slot.article.title)}</div>
        <div class="article-meta">€${fmtPrice(slot.article.sale_price)} · Mindest €${fmtPrice(slot.article.min_price)}</div>
      </div>
      <button class="btn btn-success" onclick="goToUpload('${slot.id}')">📎 Weiter zu Fotos & Dokumente</button>
      <button class="btn btn-danger-soft" onclick="clearSlot('${slot.id}')">🗑 Slot leeren</button>`;
  } else if (slot.status === 'uploading' || slot.status === 'analyzing') {
    body = `
      <div class="article-card">
        <div class="article-title">${esc(slot.article?.title || 'Artikel')}</div>
        <div class="article-meta">${slot.status === 'analyzing' ? 'KI analysiert...' : 'Wird hochgeladen...'}</div>
      </div>
      <div class="spinner"></div>
      <button class="btn btn-soft" onclick="goToUpload('${slot.id}')">📎 Weiter bearbeiten</button>`;
  } else if (slot.status === 'active') {
    body = `
      <div class="article-card">
        <div class="article-title">${esc(slot.article?.title || 'Artikel')}</div>
        <div class="article-meta">€${fmtPrice(slot.article?.sale_price)} · Bot läuft</div>
      </div>
      <div class="bot-info">Code: <span class="bot-code">${esc(slot.bot_code || '—')}</span></div>
      <div class="btn-row">
        <button class="btn btn-soft" onclick="showAssets('${slot.id}','wa')">💬 WA</button>
        <button class="btn btn-soft" onclick="showAssets('${slot.id}','qr')">📱 QR</button>
        <button class="btn btn-soft" onclick="showAssets('${slot.id}','widget')">🔌 Widget</button>
      </div>
      <button class="btn btn-danger-soft" onclick="clearSlot('${slot.id}')">🗑 Bot deaktivieren</button>`;
  }

  return `
    <div class="slot">
      <div class="slot-head">
        <div class="slot-num"><div class="slot-badge">${slot.slot_number}</div>Slot ${slot.slot_number}</div>
        ${pill}
      </div>
      <div class="slot-body">${body}</div>
    </div>`;
}

function pillLabel(s) {
  return {
    empty: 'Leer', configured: 'Bereit', uploading: 'Upload',
    analyzing: 'Analyse', active: 'Aktiv', paused: 'Pausiert'
  }[s] || s;
}

// ── ARTIKEL MODAL ────────────────────────────────────
function openArticleModal(slotId) {
  activeSlotId = slotId;
  document.getElementById('f-title').value = '';
  document.getElementById('f-price').value = '';
  document.getElementById('f-minprice').value = '';
  document.getElementById('f-location').value = '';
  document.getElementById('f-anrede').value = 'Sie';
  document.getElementById('articleErr').textContent = '';
  document.getElementById('articleModal').classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 100);
}
function closeArticleModal() {
  document.getElementById('articleModal').classList.remove('open');
}

async function saveArticle() {
  const title    = document.getElementById('f-title').value.trim();
  const price    = parseFloat(document.getElementById('f-price').value);
  const minprice = parseFloat(document.getElementById('f-minprice').value);
  const location = document.getElementById('f-location').value.trim();
  const anrede   = document.getElementById('f-anrede').value;
  const err      = document.getElementById('articleErr');
  const btn      = document.getElementById('saveArticleBtn');

  if (!title)              { err.textContent = 'Artikelbezeichnung fehlt'; return; }
  if (!price || price <= 0)        { err.textContent = 'Verkaufspreis erforderlich'; return; }
  if (!minprice || minprice <= 0)  { err.textContent = 'Mindestpreis erforderlich'; return; }
  if (minprice > price)    { err.textContent = 'Mindestpreis muss unter Verkaufspreis liegen'; return; }

  err.textContent = '';
  btn.disabled = true; btn.textContent = '⏳ Wird gespeichert...';

  try {
    const r = await fetch(API + '/api/cv/slot/' + activeSlotId + '/article', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, sale_price: price, min_price: minprice, location, anrede })
    });
    const d = await r.json();
    if (!d.success) {
      err.textContent = d.error || 'Fehler beim Speichern';
      btn.disabled = false; btn.textContent = 'Weiter → Fotos & Dokumente';
      return;
    }
    closeArticleModal();
    location.href = 'cv-upload.html?slot=' + activeSlotId;
  } catch(e) {
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = 'Weiter → Fotos & Dokumente';
  }
}

function goToUpload(slotId) {
  location.href = 'cv-upload.html?slot=' + slotId;
}

// ── SLOT LEEREN ──────────────────────────────────────
async function clearSlot(slotId) {
  if (!confirm('Slot wirklich leeren? Artikel und alle Uploads werden gelöscht.')) return;
  try {
    const r = await fetch(API + '/api/cv/slot/' + slotId + '/clear', { method: 'POST' });
    const d = await r.json();
    if (d.success) { toast('✓ Slot geleert'); loadDashboard(); }
    else { toast('Fehler: ' + (d.error || 'unbekannt')); }
  } catch(e) { toast('Fehler: ' + e.message); }
}

// ── BOT ASSETS ANZEIGEN ──────────────────────────────
async function showAssets(slotId, defaultTab) {
  try {
    const r = await fetch(API + '/api/cv/slot/' + slotId);
    const d = await r.json();
    if (!d.slot) { toast('Slot nicht gefunden'); return; }

    const slot = d.slot;
    document.getElementById('assetBody').innerHTML = `
      <div style="margin-bottom:18px;">
        <div class="field-label">Bot-Code</div>
        <div style="font-family:monospace;font-size:1.1rem;font-weight:900;color:var(--g2);background:#f0fdf4;padding:10px 14px;border-radius:8px;">${esc(slot.bot_code || '')}</div>
      </div>

      <div style="margin-bottom:18px;">
        <div class="field-label">💬 WhatsApp Link</div>
        <div style="background:#f8faf9;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.78rem;word-break:break-all;margin-bottom:6px;">${esc(slot.wa_deeplink || '')}</div>
        <button class="btn btn-soft" id="copyWa" onclick="copyText('${esc(slot.wa_deeplink || '')}', this)">📋 Link kopieren</button>
      </div>

      <div style="margin-bottom:18px;">
        <div class="field-label">📱 QR-Code</div>
        <div style="background:#f8faf9;border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;">
          <img src="${esc(slot.qr_code_url || '')}" alt="QR" style="max-width:200px;width:100%;">
        </div>
        <a href="${esc(slot.qr_code_url || '')}" download="qr-${esc(slot.bot_code || 'bot')}.png" class="btn btn-soft" style="display:block;text-align:center;text-decoration:none;margin-top:6px;">⬇ QR herunterladen</a>
      </div>

      <div>
        <div class="field-label">🔌 Widget-Code (für Webseite)</div>
        <textarea readonly style="width:100%;height:90px;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:monospace;font-size:.72rem;background:#f8faf9;">${esc(slot.widget_code || '')}</textarea>
        <button class="btn btn-soft" onclick="copyText(\`${(slot.widget_code || '').replace(/`/g,'\\\`').replace(/\$/g,'\\$')}\`, this)" style="margin-top:6px;">📋 Widget-Code kopieren</button>
      </div>`;
    document.getElementById('assetModal').classList.add('open');
  } catch(e) { toast('Fehler: ' + e.message); }
}
function closeAssetModal() { document.getElementById('assetModal').classList.remove('open'); }

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.classList.add('copied');
    btn.textContent = '✓ Kopiert!';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = orig; }, 1500);
  }).catch(() => toast('Kopieren fehlgeschlagen'));
}

// ── HELPERS ─────────────────────────────────────────
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtPrice(p) { if (p == null) return '—'; return Number(p).toLocaleString('de-AT', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>

</body>
</html>
