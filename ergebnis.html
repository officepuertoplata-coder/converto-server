<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verkaufsreport</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g:#25D366;--g2:#1b4332;--bg:#f0f2f0;--card:#fff;--border:#e5e7eb;--mu:#6b7280;--txt:#1a1a1a;--red:#ef4444;--blue:#1d4ed8;--r:12px;--gold:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:40px;}
.topbar{background:var(--g2);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.topbar h1{font-size:1rem;font-weight:800;}
.main{max-width:680px;margin:0 auto;padding:16px;}

/* ARTIKEL CARD */
.art-card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:20px;overflow:hidden;}
.art-head{background:var(--g2);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;}
.art-num{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;flex-shrink:0;}
.art-title{font-size:.95rem;font-weight:800;flex:1;}
.art-status{font-size:.72rem;opacity:.7;}

/* SECTIONS */
.sec{padding:16px;border-top:1px solid var(--border);}
.sec-title{font-size:.72rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.sec-title span{background:var(--g2);color:#fff;font-size:.6rem;padding:2px 7px;border-radius:10px;}

/* REPORT FELDER */
.field-row{margin-bottom:10px;}
.field-label{font-size:.68rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.field-val{background:#f9fafb;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.88rem;line-height:1.6;cursor:pointer;transition:border-color .2s;position:relative;}
.field-val:hover{border-color:var(--g);}
.field-edit{width:100%;padding:10px 12px;border:1.5px solid var(--g);border-radius:8px;font-size:.88rem;font-family:'Nunito',sans-serif;background:#fff;resize:vertical;}
.field-edit:focus{outline:none;}
.copy-hint{font-size:.65rem;color:var(--mu);margin-top:3px;}

/* PREIS GRID */
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px;}
.price-box{background:#f0fdf4;border:1.5px solid #86efac;border-radius:10px;padding:12px;text-align:center;}
.price-label{font-size:.65rem;font-weight:800;color:#15803d;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.price-val{font-size:1.3rem;font-weight:900;color:#15803d;}

/* BULLETS */
.bullet-list{list-style:none;padding:0;}
.bullet-list li{display:flex;align-items:flex-start;gap:8px;font-size:.85rem;padding:5px 0;border-bottom:1px solid #f3f4f6;}
.bullet-list li:last-child{border-bottom:none;}
.bullet-list li::before{content:'✓';color:var(--g);font-weight:900;flex-shrink:0;margin-top:1px;}

/* FOTOS */
.foto-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.foto-thumb{width:80px;height:80px;border-radius:8px;overflow:hidden;position:relative;background:#f3f4f6;flex-shrink:0;}
.foto-thumb img{width:100%;height:100%;object-fit:cover;}
.foto-del{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.add-foto-btn{width:80px;height:80px;border:2px dashed var(--border);border-radius:8px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mu);font-size:.65rem;font-family:'Nunito',sans-serif;transition:border-color .2s;}
.add-foto-btn:hover{border-color:var(--g);color:var(--g);}
.reanalyze-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#fff;border:1.5px solid var(--border);border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;color:var(--mu);transition:all .2s;}
.reanalyze-btn:hover{border-color:var(--g2);color:var(--g2);}

/* DOKUMENTE */
.doc-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f0f9ff;border:1px solid #bfdbfe;border-radius:8px;margin-bottom:5px;}
.doc-label{flex:1;font-size:.82rem;font-weight:700;color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc-analyze-btn{font-size:.7rem;color:#15803d;font-weight:700;padding:3px 8px;background:#f0fdf4;border:1px solid #86efac;border-radius:5px;cursor:pointer;white-space:nowrap;}
.doc-del-btn{background:none;border:none;color:#9ca3af;cursor:pointer;font-size:.85rem;}
.doc-del-btn:hover{color:var(--red);}
.doc-add-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.doc-inp{flex:1;min-width:120px;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.8rem;font-family:'Nunito',sans-serif;}
.doc-upload-btn{padding:8px 12px;background:#fff;border:1.5px solid #bfdbfe;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--blue);font-family:'Nunito',sans-serif;}

/* WISSENSDATENBANK */
.q-item{margin-bottom:10px;}
.q-label{font-size:.75rem;font-weight:800;color:#374151;margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.q-important{color:var(--g);font-size:.65rem;}
.q-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;font-family:'Nunito',sans-serif;background:#fff;}
.q-input:focus{outline:none;border-color:var(--g);}
.q-input.filled{background:#f0fdf4;border-color:#86efac;}

/* EINSPRUCH */
.einspruch-box{background:#fff7ed;border:1.5px solid var(--gold);border-radius:10px;padding:14px;}
.einspruch-label{font-size:.75rem;font-weight:800;color:#92400e;margin-bottom:6px;}
.einspruch-input{width:100%;padding:10px 12px;border:1.5px solid #fde68a;border-radius:8px;font-size:.85rem;font-family:'Nunito',sans-serif;background:#fff;resize:vertical;min-height:70px;}
.einspruch-input:focus{outline:none;border-color:var(--gold);}

/* ACTIONS */
.action-row{display:flex;gap:8px;flex-wrap:wrap;padding:16px;border-top:1px solid var(--border);}
.btn{padding:11px 18px;border-radius:10px;font-size:.85rem;font-weight:800;cursor:pointer;border:none;font-family:'Nunito',sans-serif;transition:all .2s;}
.btn-primary{background:var(--g);color:#fff;box-shadow:0 2px 8px rgba(37,211,102,.25);}
.btn-primary:hover{background:#128C7E;}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{background:#f3f4f6;color:#374151;border:1.5px solid var(--border);}
.btn-secondary:hover{background:#e5e7eb;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{background:#d97706;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-blue:disabled{opacity:.5;cursor:not-allowed;}
.btn-sm{padding:8px 14px;font-size:.78rem;}

/* LP SECTION */
.lp-section{background:#f0fdf4;border:2px solid #86efac;border-radius:var(--r);padding:16px;margin-top:4px;}
.lp-title{font-size:.85rem;font-weight:800;color:#15803d;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.lp-field{margin-bottom:12px;}
.lp-label{font-size:.7rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.lp-input{width:100%;padding:9px 12px;border:1.5px solid #86efac;border-radius:8px;font-size:.88rem;font-family:'Nunito',sans-serif;background:#fff;}
.lp-input:focus{outline:none;border-color:var(--g);}
.lp-toggle-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
.lp-toggle{width:40px;height:24px;border-radius:12px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.lp-toggle.on{background:var(--g);}
.lp-toggle.off{background:#d1d5db;}
.lp-toggle::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;transition:left .2s;}
.lp-toggle.on::after{left:19px;}
.lp-toggle.off::after{left:3px;}
.lp-toggle-label{font-size:.88rem;font-weight:700;}
.lp-success{background:#f0fdf4;border:2px solid #86efac;border-radius:10px;padding:16px;text-align:center;}
.lp-success-url{font-size:1rem;font-weight:900;color:#15803d;margin:8px 0;word-break:break-all;}

/* STATUS BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:20px;}
.badge-green{background:#f0fdf4;color:#15803d;border:1px solid #86efac;}
.badge-yellow{background:#fff7ed;color:#92400e;border:1px solid #fde68a;}
.badge-blue{background:#eff6ff;color:var(--blue);border:1px solid #bfdbfe;}

/* MISC */
.loading{text-align:center;padding:60px 20px;color:var(--mu);}
.ring{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:#fef2f2;border:1.5px solid #fecaca;border-radius:10px;padding:16px;margin:20px;text-align:center;color:var(--red);font-weight:700;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--g2);color:#fff;padding:10px 20px;border-radius:30px;font-size:.85rem;font-weight:700;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.delete-info{text-align:center;font-size:.75rem;color:var(--mu);padding:8px;margin-top:4px;}
</style>
</head>
<body>
<div class="topbar">
  <h1>📊 Verkaufsreport</h1>
  <span id="phoneDisplay" style="font-size:.8rem;opacity:.7;"></span>
</div>
<div id="app" class="main">
  <div class="loading"><div class="ring"></div>Lade Report...</div>
</div>
<div id="toast"></div>

<script>
const API = 'https://converto-server-production.up.railway.app';
let sessionToken = null, sd = null;
let _questions = {}, _answers = {}, _docs = {}, _lpData = {}, _lpState = {};
let _editingField = null;

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function fmt(v){return v?'€ '+parseFloat(v).toLocaleString('de-AT',{minimumFractionDigits:0,maximumFractionDigits:0}):'—'}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
function showErr(msg){document.getElementById('app').innerHTML='<div class="err-box">⚠ '+msg+'</div>';}

(function(){
  sessionToken = new URLSearchParams(location.search).get('s');
  if(!sessionToken){ showErr('Kein Auftrag gefunden.'); return; }
  loadAll();
})();

async function loadAll(){
  try {
    var r = await fetch(API+'/api/vk/results/'+sessionToken);
    if(!r.ok){ var e=await r.json(); showErr(e.error||'Fehler'); return; }
    sd = await r.json();
    document.getElementById('phoneDisplay').textContent = sd.phone||'';
    // LP Daten laden
    for(var a of (sd.articles||[])){
      try{ var lr=await fetch(API+'/api/vk/landingpage/article/'+a.id); if(lr.ok) _lpData[a.id]=await lr.json(); }catch(e){}
    }
    render();
    // Fragen + Docs laden
    for(var a of (sd.articles||[])){
      if(a.status==='analyzed') { loadQuestions(a.id); loadDocs(a.id); }
    }
  } catch(e){ showErr('Verbindungsfehler: '+e.message); }
}

function render(){
  var arts = sd?.articles||[];
  if(!arts.length){ document.getElementById('app').innerHTML='<div style="text-align:center;padding:40px;color:var(--mu);">Keine Artikel gefunden.</div>'; return; }

  var html = '';
  arts.forEach(function(a, idx){
    var an = a.analysis||{};
    var lp = _lpData[a.id];
    var lpState = _lpState[a.id]||{};
    var isAnalyzed = a.status==='analyzed';

    html += '<div class="art-card" id="art-'+a.id+'">';

    // HEAD
    html += '<div class="art-head">';
    html += '<div class="art-num">'+(idx+1)+'</div>';
    html += '<div class="art-title">'+esc(a.title||'Artikel '+(idx+1))+'</div>';
    if(isAnalyzed) html += '<span class="art-status">✓ Analysiert</span>';
    html += '</div>';

    if(!isAnalyzed){
      html += '<div style="padding:20px;text-align:center;color:var(--mu);">⏳ Analyse läuft...</div>';
      html += '</div>'; return;
    }

    // ── FOTOS (oben) ──
    html += '<div class="sec">';
    html += '<div class="sec-title">📷 Fotos <span>'+(a.vk_photos||[]).length+'</span></div>';
    html += '<div class="foto-grid" id="fg-'+a.id+'">';
    (a.vk_photos||[]).forEach(function(p){
      html += '<div class="foto-thumb"><img src="'+esc(p.public_url)+'" loading="lazy">';
      html += '<button class="foto-del" onclick="delPhoto(\'' + p.id + '\',\'' + a.id + '\')">✕</button></div>';
    });
    html += '<button class="add-foto-btn" onclick="trigAddPhoto(\'' + a.id + '\')">📷<span>Hinzufügen</span></button>';
    html += '</div>';
    html += '<button class="reanalyze-btn btn-sm" onclick="reAnalyze(\'' + a.id + '\')">🔄 Neu analysieren</button>';
    html += '</div>';

    // ── PREISE ──
    html += '<div class="sec">';
    html += '<div class="sec-title">💶 Preisempfehlung</div>';
    html += '<div class="price-grid">';
    html += '<div class="price-box"><div class="price-label">Minimum</div><div class="price-val">'+fmt(an.price_min)+'</div></div>';
    html += '<div class="price-box"><div class="price-label">Empfohlen</div><div class="price-val">'+fmt(an.price_recommended)+'</div></div>';
    html += '<div class="price-box"><div class="price-label">Maximum</div><div class="price-val">'+fmt(an.price_max)+'</div></div>';
    html += '</div>';
    if(an.price_reasoning) html += '<div style="font-size:.78rem;color:var(--mu);margin-top:6px;">'+esc(an.price_reasoning)+'</div>';
    html += '</div>';

    // ── TITEL & BESCHREIBUNG ──
    html += '<div class="sec">';
    html += '<div class="sec-title">📝 Report</div>';
    html += editableField(a.id,'title_short','Kurztitel',an.title_short,'text');
    html += editableField(a.id,'short_desc','Kurzbeschreibung',an.short_desc,'textarea');
    html += editableField(a.id,'long_desc','Langbeschreibung',an.long_desc,'textarea');
    if(an.condition) html += editableField(a.id,'condition','Zustand',an.condition,'text');
    if(an.bullet_points&&an.bullet_points.length){
      html += '<div class="field-row"><div class="field-label">Highlights</div>';
      html += '<ul class="bullet-list">'+an.bullet_points.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul></div>';
    }
    if(an.tips&&an.tips.length){
      html += '<div class="field-row"><div class="field-label">Verkaufstipps</div>';
      html += '<ul class="bullet-list" style="color:var(--mu);">'+an.tips.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>';
    }
    html += '</div>';

    // ── FOTOS ──
    html += '<div class="sec">';
    html += '<div class="sec-title">📷 Fotos <span>'+(a.vk_photos||[]).length+'</span></div>';
    html += '<div class="foto-grid" id="fg-'+a.id+'">';
    (a.vk_photos||[]).forEach(function(p){
      html += '<div class="foto-thumb"><img src="'+esc(p.public_url)+'" loading="lazy">';
      html += '<button class="foto-del" onclick="delPhoto(\''+p.id+'\',\''+a.id+'\')">✕</button></div>';
    });
    html += '<button class="add-foto-btn" onclick="trigAddPhoto(\''+a.id+'\')">📷<span>Hinzufügen</span></button>';
    html += '</div>';
    html += '<button class="reanalyze-btn btn-sm" onclick="reAnalyze(\''+a.id+'\')">🔄 Neu analysieren</button>';
    html += '</div>';

    // ── DOKUMENTE ──
    html += '<div class="sec">';
    html += '<div class="sec-title">📎 Dokumente</div>';
    html += '<div id="docs-'+a.id+'"><div style="font-size:.78rem;color:var(--mu);">Lade...</div></div>';
    html += '<div class="doc-add-row">';
    html += '<input class="doc-inp" id="dlabel-'+a.id+'" placeholder="Bezeichnung (z.B. Serviceheft)">';
    html += '<button class="doc-upload-btn" onclick="trigDocUpload(\''+a.id+'\')">📄 PDF hochladen & analysieren</button>';
    html += '<input type="file" id="docfile-'+a.id+'" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="uploadDoc(\''+a.id+'\',this)">';
    html += '</div></div>';

    // ── EINSPRUCH / KORREKTUR ──
    html += '<div class="sec">';
    html += '<div class="einspruch-box">';
    html += '<div class="einspruch-label">✏️ Korrektur der KI-Analyse</div>';
    html += '<textarea class="einspruch-input" id="einspruch-'+a.id+'" placeholder="z.B. Modell ist Toyota 8FBE20 (nicht 8FBM), KM-Stand 15.200, Baujahr 2018, Farbe blau..."></textarea>';
    html += '<div style="display:flex;gap:8px;margin-top:8px;">';
    html += '<button class="btn btn-gold btn-sm" onclick="doStep2(\''+a.id+'\')">🔄 Korrigieren & neu analysieren</button>';
    html += '</div></div></div>';

    // ── WISSENSDATENBANK ──
    html += '<div class="sec">';
    html += '<div class="sec-title">🧠 Wissensdatenbank <span id="qcount-'+a.id+'">Lade...</span></div>';
    html += '<div id="questions-'+a.id+'"><div style="font-size:.78rem;color:var(--mu);">Lade Fragen...</div></div>';
    html += '<div style="margin-top:10px;">';
    html += '<button class="btn btn-sm" style="background:#eff6ff;color:var(--blue);border:1.5px solid #bfdbfe;" onclick="saveAnswers(\''+a.id+'\')">💾 Antworten speichern</button>';
    html += '</div></div>';

    // ── DNA + LP ──
    html += '<div class="action-row">';
    if(!lp){
      html += '<button class="btn btn-primary" id="dna-btn-'+a.id+'" onclick="generateDNA(\''+a.id+'\')">🧬 DNA generieren</button>';
    } else {
      html += '<span class="badge badge-green">🧬 DNA aktiv</span>';
      html += '<button class="btn btn-sm btn-secondary" onclick="generateDNA(\''+a.id+'\')">🔄 DNA neu generieren</button>';
    }
    html += '</div>';

    // LP Section
    if(lp){
      html += '<div class="sec">';
      html += '<div style="background:#f0fdf4;border:2px solid #86efac;border-radius:10px;padding:14px;">';
      html += '<div style="font-size:.85rem;font-weight:800;color:#15803d;margin-bottom:6px;">🌐 Landingpage aktiv</div>';
      html += '<div style="font-size:.82rem;color:#374151;margin-bottom:10px;">'+esc('https://p.converdino.com/p/'+lp.slug)+'</div>';
      html += '<a href="https://p.converdino.com/p/'+esc(lp.slug)+'" target="_blank" class="btn btn-sm btn-primary" style="text-decoration:none;display:inline-block;">↗ LP öffnen</a>';
      html += '</div></div>';
    } else if(a.lp_booked){
      html += '<div class="sec" id="lp-sec-'+a.id+'" style="display:none;">';
      html += buildLPForm(a);
      html += '</div>';
    }

    html += '</div>'; // art-card
  });

  if(sd.delete_at){
    var d = new Date(sd.delete_at);
    html += '<div class="delete-info">🗑 Wird gelöscht am '+d.toLocaleDateString('de-AT')+'</div>';
  }

  document.getElementById('app').innerHTML = html;
  checkPolling();
}

function editableField(artId, field, label, value, type){
  var key = artId+'__'+field;
  var isEditing = _editingField === key;
  var html = '<div class="field-row">';
  html += '<div class="field-label">'+label+'</div>';
  if(isEditing){
    if(type==='textarea'){
      html += '<textarea class="field-edit" id="fe-'+key+'" rows="4">'+esc(value||'')+'</textarea>';
    } else {
      html += '<input type="text" class="field-edit" id="fe-'+key+'" value="'+esc(value||'')+'">';
    }
    html += '<div style="display:flex;gap:6px;margin-top:6px;">';
    html += '<button class="btn btn-primary btn-sm" onclick="saveField(\''+artId+'\',\''+field+'\')">✓ Speichern</button>';
    html += '<button class="btn btn-secondary btn-sm" onclick="cancelEdit()">Abbrechen</button>';
    html += '</div>';
  } else {
    html += '<div class="field-val" onclick="startEdit(\''+artId+'\',\''+field+'\')">'+esc(value||'—')+'<div class="copy-hint">✏️ Tippen zum Bearbeiten</div></div>';
  }
  html += '</div>';
  return html;
}

function startEdit(artId, field){
  _editingField = artId+'__'+field;
  render();
  setTimeout(function(){ var el=document.getElementById('fe-'+_editingField); if(el){el.focus();el.select&&el.select();} },50);
}

function cancelEdit(){ _editingField=null; render(); }

async function saveField(artId, field){
  var key = artId+'__'+field;
  var el = document.getElementById('fe-'+key);
  if(!el) return;
  var val = el.value;
  // Update lokal
  var art = (sd.articles||[]).find(function(a){return a.id===artId;});
  if(art && art.analysis) art.analysis[field] = val;
  if(field==='title_short' && art) art.title = val;
  // Speichern
  try{
    await fetch(API+'/api/vk/article/'+artId+'/notes',{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({[field]:val, title: field==='title_short'?val:undefined})});
    showToast('✓ Gespeichert');
  }catch(e){ showToast('Fehler: '+e.message); }
  _editingField = null;
  render();
}

// ── FRAGEN ────────────────────────────────────────────
async function loadQuestions(artId){
  try{
    var r = await fetch(API+'/api/vk/article/'+artId+'/questions');
    var d = await r.json();
    _questions[artId] = d.questions||[];
    _answers[artId] = d.answers||{};
    renderQuestions(artId);
  }catch(e){}
}

function renderQuestions(artId){
  var qs=_questions[artId]||[], ans=_answers[artId]||{};
  var el=document.getElementById('questions-'+artId);
  var cnt=document.getElementById('qcount-'+artId);
  if(!el) return;

  // Extra-Fakten parsen
  var extraFacts=[];
  if(ans.q_extra){ ans.q_extra.split('|||').forEach(function(p){ var s=p.indexOf(':'); if(s>0) extraFacts.push({k:p.slice(0,s).trim(),v:p.slice(s+1).trim()}); }); }

  if(cnt) cnt.textContent=(qs.length+extraFacts.length)+' Einträge';

  var rows='';
  if(qs.length){
    rows+='<div style="font-size:.7rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">Standardfelder</div>';
    qs.forEach(function(q){
      var val=ans[q.id]||'';
      var filled=val?' filled':'';
      rows+='<div class="q-item"><div class="q-label">'+esc(q.label)+(q.important?'<span class="q-important">★</span>':'')+'</div>';
      if(q.type==='yesno'){
        rows+='<select class="q-input'+filled+'" data-aid="'+artId+'" data-qid="'+q.id+'">';
        rows+='<option value="">— Auswählen</option>';
        rows+='<option value="ja"'+(val==='ja'?' selected':'')+'>Ja</option>';
        rows+='<option value="nein"'+(val==='nein'?' selected':'')+'>Nein</option>';
        rows+='</select>';
      } else {
        rows+='<input type="'+(q.type==='number'?'number':'text')+'" class="q-input'+filled+'" data-aid="'+artId+'" data-qid="'+q.id+'" value="'+esc(val)+'" placeholder="'+esc(q.placeholder||'')+'">';
      }
      rows+='</div>';
    });
  }

  rows+='<div style="font-size:.7rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;">Technische Daten <span style="color:#1d4ed8;font-weight:600;text-transform:none;">'+(extraFacts.length?extraFacts.length+' Einträge':'leer')+'</span></div>';
  extraFacts.forEach(function(f,i){
    rows+='<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">';
    rows+='<input type="text" class="q-input" style="flex:1;background:#f0f9ff;border-color:#bfdbfe;font-size:.78rem;" data-aid="'+artId+'" data-eidx="'+i+'" data-efield="k" value="'+esc(f.k)+'" placeholder="Bezeichnung">';
    rows+='<input type="text" class="q-input" style="flex:2;font-size:.78rem;" data-aid="'+artId+'" data-eidx="'+i+'" data-efield="v" value="'+esc(f.v)+'" placeholder="Wert">';
    rows+='<button style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:.9rem;padding:4px;" data-aid="'+artId+'" data-eidx="'+i+'" class="rm-extra-btn">✕</button>';
    rows+='</div>';
  });
  rows+='<button class="add-extra-btn" data-aid="'+artId+'" style="margin-top:4px;padding:7px 14px;background:#f9fafb;border:1.5px dashed var(--border);border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--mu);width:100%;">+ Feld hinzufügen</button>';

  el.innerHTML=rows;

  // Event Listener
  el.querySelectorAll('[data-qid]').forEach(function(inp){
    inp.addEventListener('input',function(){ setAnswer(inp.dataset.aid,inp.dataset.qid,inp.value); inp.classList.toggle('filled',!!inp.value); });
    inp.addEventListener('change',function(){ setAnswer(inp.dataset.aid,inp.dataset.qid,inp.value); inp.classList.toggle('filled',!!inp.value); });
  });
  el.querySelectorAll('[data-efield]').forEach(function(inp){
    inp.addEventListener('input',function(){ updateExtra(inp.dataset.aid,parseInt(inp.dataset.eidx),inp.dataset.efield,inp.value); });
  });
  el.querySelectorAll('.rm-extra-btn').forEach(function(btn){
    btn.addEventListener('click',function(){ removeExtra(btn.dataset.aid,parseInt(btn.dataset.eidx)); });
  });
  el.querySelector('.add-extra-btn')?.addEventListener('click',function(e){ addExtra(e.target.dataset.aid); });
}

function updateExtra(artId,idx,field,val){
  if(!_answers[artId]) _answers[artId]={};
  var parts=(_answers[artId].q_extra||'').split('|||').filter(Boolean);
  while(parts.length<=idx) parts.push(':');
  var cur=parts[idx], s=cur.indexOf(':');
  parts[idx]=field==='k'?val+':'+(s>=0?cur.slice(s+1):''):(s>=0?cur.slice(0,s):cur)+':'+val;
  _answers[artId].q_extra=parts.join('|||');
}

function removeExtra(artId,idx){
  if(!_answers[artId]) return;
  var parts=(_answers[artId].q_extra||'').split('|||').filter(Boolean);
  parts.splice(idx,1);
  _answers[artId].q_extra=parts.join('|||');
  renderQuestions(artId);
}

function addExtra(artId){
  if(!_answers[artId]) _answers[artId]={};
  var parts=(_answers[artId].q_extra||'').split('|||').filter(Boolean);
  parts.push(':');
  _answers[artId].q_extra=parts.join('|||');
  renderQuestions(artId);
}

function setAnswerById(elemId, artId, qid){
  var el = document.getElementById(elemId);
  if(el) setAnswer(artId, qid, el.value);
}
function setAnswer(artId, qid, val){
  if(!_answers[artId]) _answers[artId]={};
  _answers[artId][qid] = val;
  var el = document.getElementById('q-'+artId+'-'+qid);
  if(el){ if(val) el.classList.add('filled'); else el.classList.remove('filled'); }
}

async function saveAnswers(artId){
  try{
    await fetch(API+'/api/vk/article/'+artId+'/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:_answers[artId]||{}})});
    showToast('✓ Antworten gespeichert');
  }catch(e){ showToast('Fehler: '+e.message); }
}

// ── ANALYSE STEP 2 ────────────────────────────────────
async function doStep2(artId){
  var einspruch = (document.getElementById('einspruch-'+artId)||{}).value||'';
  var btn = document.querySelector('#art-'+artId+' .btn-gold');
  if(btn){btn.disabled=true;btn.textContent='⏳ Wird analysiert...';}
  try{
    await saveAnswers(artId);
    var r = await fetch(API+'/api/vk/article/'+artId+'/analyze-step2',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({einspruch})});
    var d = await r.json();
    if(d.error) throw new Error(d.error);
    showToast('✓ Analyse aktualisiert!');
    await loadAll();
  }catch(e){ showToast('Fehler: '+e.message); if(btn){btn.disabled=false;btn.textContent='🔄 Korrigieren & neu analysieren';} }
}

// ── DNA GENERIEREN ────────────────────────────────────
async function generateDNA(artId){
  var btn = document.getElementById('dna-btn-'+artId);
  if(btn){btn.disabled=true;btn.textContent='⏳ DNA wird generiert...';}
  try{
    await saveAnswers(artId);
    var r = await fetch(API+'/api/vk/article/'+artId+'/generate-dna',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:_answers[artId]||{}})});
    var d = await r.json();
    if(d.error) throw new Error(d.error);
    showToast('✓ DNA generiert!');
    // LP Sektion einblenden
    var lpSec = document.getElementById('lp-sec-'+artId);
    if(lpSec) lpSec.style.display='block';
    if(btn){btn.textContent='🧬 DNA aktiv ✓';btn.style.background='#15803d';}
  }catch(e){ showToast('Fehler: '+e.message); if(btn){btn.disabled=false;btn.textContent='🧬 DNA generieren';} }
}

// ── LP FORM ────────────────────────────────────────────
function buildLPForm(a){
  var s = _lpState[a.id]||{pickup:true,shipping:false,hasBot:!!a.lp_has_bot,anrede:'Sie'};
  _lpState[a.id] = s;
  var html = '<div class="lp-section"><div class="lp-title">🌐 Landingpage einrichten</div>';
  html += '<div class="lp-field"><div class="lp-label">Verkaufspreis</div>';
  html += '<input type="number" class="lp-input" id="lp-price-'+a.id+'" placeholder="z.B. 4900" step="1"></div>';
  html += '<div class="lp-field"><div class="lp-label">Mindestpreis (für Bot-Verhandlung)</div>';
  html += '<input type="number" class="lp-input" id="lp-minprice-'+a.id+'" placeholder="z.B. 4200" step="1"></div>';
  html += '<div class="lp-field"><div class="lp-label">Abholort</div>';
  html += '<input type="text" class="lp-input" id="lp-location-'+a.id+'" placeholder="z.B. Wien, 1010"></div>';
  html += '<div class="lp-toggle-row"><button class="lp-toggle '+(s.pickup?'on':'off')+'" onclick="togLP(\''+a.id+'\',\'pickup\')"></button>';
  html += '<span class="lp-toggle-label">Abholung möglich</span></div>';
  html += '<div class="lp-toggle-row"><button class="lp-toggle '+(s.shipping?'on':'off')+'" onclick="togLP(\''+a.id+'\',\'shipping\')"></button>';
  html += '<span class="lp-toggle-label">Versand möglich</span></div>';
  if(a.lp_has_bot){
    html += '<div class="lp-toggle-row"><button class="lp-toggle '+(s.hasBot?'on':'off')+'" onclick="togLP(\''+a.id+'\',\'hasBot\')"></button>';
    html += '<span class="lp-toggle-label">WhatsApp-Bot aktivieren</span></div>';
    html += '<div class="lp-field" style="margin-top:10px;"><div class="lp-label">Anrede im Bot</div>';
    html += '<select class="lp-input" id="lp-anrede-'+a.id+'">';
    html += '<option value="Sie"'+(s.anrede==='Sie'?' selected':'')+'>Sie</option>';
    html += '<option value="du"'+(s.anrede==='du'?' selected':'')+'>Du</option>';
    html += '</select></div>';
  }
  html += '<button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="createLP(\''+a.id+'\')">🚀 Landingpage erstellen</button>';
  html += '</div>';
  return html;
}

function togLP(artId, field){
  if(!_lpState[artId]) _lpState[artId]={pickup:true,shipping:false,hasBot:false,anrede:'Sie'};
  _lpState[artId][field] = !_lpState[artId][field];
  var btn = event.target.closest('button');
  if(btn){ btn.classList.toggle('on'); btn.classList.toggle('off'); }
}

async function createLP(artId){
  var art = (sd.articles||[]).find(function(a){return a.id===artId;});
  if(!art) return;
  var s = _lpState[artId]||{};
  var price = parseFloat(document.getElementById('lp-price-'+artId)?.value||0);
  var minPrice = parseFloat(document.getElementById('lp-minprice-'+artId)?.value||0);
  var location = document.getElementById('lp-location-'+artId)?.value||'';
  var anrede = document.getElementById('lp-anrede-'+artId)?.value||'Sie';
  var days = art.lp_days||7;
  var btn = event.target;
  btn.disabled=true; btn.textContent='⏳ Erstelle...';
  try{
    var r = await fetch(API+'/api/vk/landingpage',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({article_id:artId,session_id:sd.id,days,has_bot:s.hasBot,
        delivery_pickup:s.pickup,delivery_shipping:s.shipping,
        pickup_location:location,sale_price:price||null,min_price:minPrice||null,anrede,
        bot_goals:['direktkauf','rueckruf']})});
    var d = await r.json();
    if(d.error) throw new Error(d.error);
    _lpData[artId] = d.landingpage;
    showToast('✓ Landingpage erstellt!');
    render();
    loadQuestions(artId); loadDocs(artId);
  }catch(e){ showToast('Fehler: '+e.message); btn.disabled=false; btn.textContent='🚀 Landingpage erstellen'; }
}

// ── FOTOS ─────────────────────────────────────────────
function trigAddPhoto(artId){ var i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=async()=>{if(i.files)await uploadPhotos(artId,Array.from(i.files));};i.click(); }

async function uploadPhotos(artId,files){
  showToast('⏳ '+files.length+' Foto(s) hochladen...');
  for(var f of files){
    var b64=await toBase64(f);
    await fetch(API+'/api/vk/photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({article_id:artId,session_id:sd.id,image_base64:b64,content_type:f.type||'image/jpeg'})});
  }
  showToast('✓ Fotos hochgeladen');
  await loadAll();
}

async function delPhoto(pid, artId){
  if(!confirm('Foto löschen?')) return;
  await fetch(API+'/api/vk/photo/'+pid,{method:'DELETE'});
  await loadAll();
}

async function reAnalyze(artId){
  if(!confirm('Artikel neu analysieren?')) return;
  showToast('⏳ Analyse läuft...');
  try{
    var r = await fetch(API+'/api/vk/article/'+artId+'/analyze-step2',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({einspruch:''})});
    var d = await r.json();
    if(d.error) throw new Error(d.error);
    showToast('✓ Neu analysiert!');
    await loadAll();
  }catch(e){ showToast('Fehler: '+e.message); }
}

// ── DOKUMENTE ─────────────────────────────────────────
async function loadDocs(artId){
  try{
    var r=await fetch(API+'/api/vk/article/'+artId+'/docs');
    _docs[artId]=await r.json();
    renderDocs(artId);
  }catch(e){}
}

function renderDocs(artId){
  var el=document.getElementById('docs-'+artId); if(!el) return;
  var docs=_docs[artId]||[];
  var html='';
  if(!docs.length) html='<div style="font-size:.78rem;color:var(--mu);padding:4px 0;">Noch keine Dokumente</div>';
  docs.forEach(function(d){
    html+='<div class="doc-item"><span>'+(d.type==='pdf'?'📄':'🔗')+'</span>';
    html+='<span class="doc-label">'+esc(d.label)+'</span>';
    if(d.public_url)html+='<a href="'+esc(d.public_url)+'" target="_blank" style="font-size:.7rem;color:var(--blue);font-weight:700;">↗</a>';
    if(d.type==='pdf'&&d.public_url)html+='<button class="doc-analyze-btn" onclick="analyzeExistingDoc(\''+artId+'\',\''+esc(d.public_url)+'\',\''+esc(d.label)+'\',this)">🔍 Analysieren</button>';
    html+='<button class="doc-del-btn" onclick="deleteDoc(\''+d.id+'\',\''+artId+'\')">✕</button></div>';
  });
  el.innerHTML=html;
}

function trigDocUpload(artId){ document.getElementById('docfile-'+artId).click(); }

async function uploadDoc(artId,input){
  var file=input.files[0]; if(!file) return;
  var label=(document.getElementById('dlabel-'+artId)||{}).value||file.name;
  if(!label){alert('Bitte Bezeichnung eingeben');return;}
  var reader=new FileReader();
  reader.onload=async function(){
    var base64=reader.result.split(',')[1];
    try{
      var r=await fetch(API+'/api/vk/article/'+artId+'/analyze-with-doc',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({label,pdf_base64:base64,file_name:file.name,pdf_content_type:file.type,type:'pdf',session_id:sd?.id})});
      var d=await r.json();
      showToast('✓ '+(d.facts_count||0)+' Fakten extrahiert');
      await loadDocs(artId);
      await loadQuestions(artId);
      var inp=document.getElementById('dlabel-'+artId); if(inp)inp.value='';
    }catch(e){alert('Fehler: '+e.message);}
  };
  reader.readAsDataURL(file);
}

async function analyzeExistingDoc(artId,url,label,btn){
  if(btn){btn.disabled=true;btn.textContent='⏳...';}
  try{
    var res=await fetch(url);
    var buf=await res.arrayBuffer();
    var base64=btoa(String.fromCharCode(...new Uint8Array(buf)));
    var ct=res.headers.get('content-type')||'application/pdf';
    var r=await fetch(API+'/api/vk/article/'+artId+'/analyze-with-doc',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({label,pdf_base64:base64,pdf_content_type:ct,file_name:label+'.pdf',type:'pdf'})});
    var d=await r.json();
    showToast('✓ '+(d.facts_count||0)+' Fakten extrahiert');
    await loadQuestions(artId);
  }catch(e){showToast('Fehler: '+e.message);}
  if(btn){btn.disabled=false;btn.textContent='🔍 Analysieren';}
}

async function deleteDoc(docId,artId){
  if(!confirm('Dokument löschen?')) return;
  await fetch(API+'/api/vk/doc/'+docId,{method:'DELETE'});
  await loadDocs(artId);
}

function toBase64(file){return new Promise((res,rej)=>{var r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});}

// Auto-Poll wenn Analyse noch läuft
var _pollTimer = null;
function checkPolling(){
  var analyzing = (sd?.articles||[]).some(function(a){ return a.status!=='analyzed'; });
  if(analyzing && !_pollTimer){
    _pollTimer = setInterval(async function(){
      var r = await fetch(API+'/api/vk/results/'+sessionToken).catch(()=>null);
      if(!r||!r.ok) return;
      var fresh = await r.json();
      var wasAnalyzing = (sd?.articles||[]).some(function(a){ return a.status!=='analyzed'; });
      sd = fresh;
      var nowAnalyzing = (sd?.articles||[]).some(function(a){ return a.status!=='analyzed'; });
      if(!nowAnalyzing){
        clearInterval(_pollTimer); _pollTimer=null;
        render();
        for(var a of (sd.articles||[])){ loadQuestions(a.id); loadDocs(a.id); }
        showToast('✓ Analyse abgeschlossen!');
      } else if(wasAnalyzing !== nowAnalyzing) {
        render();
      }
    }, 4000);
  } else if(!analyzing && _pollTimer){
    clearInterval(_pollTimer); _pollTimer=null;
  }
}
