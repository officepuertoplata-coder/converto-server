<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dein Verkaufsreport</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--wa:#25D366;--bg:#f5f5f5;--card:#fff;--border:#e5e7eb;--txt:#1a1a1a;--mu:#6b7280;--gold:#f4a100;--r:12px;--font:'Nunito',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:40px;}
header{background:var(--wa);color:#fff;padding:16px 20px;}
.header-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.logo{font-weight:900;font-size:1.1rem;}
.logo span{opacity:.8;font-size:.75rem;display:block;font-weight:600;}
.role-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:800;white-space:nowrap;}
.main{max-width:720px;margin:0 auto;padding:16px;}
.loading{text-align:center;padding:60px;color:var(--mu);}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--wa);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.delete-banner{background:#fef2f2;border:1.5px solid #fecaca;border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-size:.82rem;color:#991b1b;}
.article-result{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);margin-bottom:20px;overflow:hidden;}
.article-header{background:var(--wa);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;}
.article-num{background:rgba(255,255,255,.2);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;flex-shrink:0;}
.article-title-input{font-size:.95rem;font-weight:800;flex:1;background:transparent;border:1.5px solid transparent;border-radius:6px;padding:2px 6px;color:#fff;font-family:inherit;cursor:pointer;min-width:0;}
.article-title-input:hover{border-color:rgba(255,255,255,.4);}
.article-title-input:focus{outline:none;border-color:rgba(255,255,255,.8);background:rgba(255,255,255,.1);}
.photos-strip{display:flex;gap:8px;padding:14px 16px;overflow-x:auto;min-height:100px;align-items:flex-start;flex-wrap:wrap;}
.photo-wrap{position:relative;flex-shrink:0;}
.photo-wrap img{height:90px;width:90px;object-fit:cover;border-radius:8px;display:block;}
.section{padding:14px 16px;border-top:1px solid var(--border);}
.section-title{font-size:.68rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;}
.copy-field{background:#f9fafb;border:1.5px solid var(--border);border-radius:8px;padding:12px;font-size:.88rem;line-height:1.6;position:relative;margin-bottom:8px;cursor:pointer;transition:border-color .2s,background .2s;}
.copy-field:hover,.copy-field.copied{border-color:var(--wa);background:#f0fdf4;}
.cf-label{font-size:.7rem;color:var(--mu);font-weight:700;margin-bottom:4px;}
.cf-text{white-space:pre-wrap;word-break:break-word;padding-right:80px;}
.copy-btn{position:absolute;top:8px;right:8px;background:var(--wa);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:var(--font);pointer-events:none;}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px;}
.price-card{background:#f9fafb;border:1.5px solid var(--border);border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;}
.price-card:hover{border-color:var(--wa);background:#f0fdf4;}
.price-val{font-size:1.2rem;font-weight:900;color:var(--wa);margin-bottom:2px;}
.price-lbl{font-size:.68rem;color:var(--mu);font-weight:700;}
.bullet-list{display:flex;flex-direction:column;gap:6px;}
.bullet-item{display:flex;align-items:flex-start;gap:8px;background:#f9fafb;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s;}
.bullet-item:hover{border-color:var(--wa);background:#f0fdf4;}
.bullet-dot{color:var(--wa);font-weight:900;flex-shrink:0;}
.bullet-text{font-size:.85rem;flex:1;}
.keywords{display:flex;flex-wrap:wrap;gap:6px;}
.keyword{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;padding:4px 10px;border-radius:20px;font-size:.78rem;font-weight:700;cursor:pointer;}
.keyword:hover{background:#dbeafe;}
.keyword.copied{background:#dcfce7;border-color:#86efac;color:#15803d;}
.tip-list{display:flex;flex-direction:column;gap:6px;}
.tip{background:#fefce8;border:1.5px solid #fef08a;border-radius:8px;padding:10px 12px;font-size:.85rem;display:flex;gap:8px;}
.copy-all-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.76rem;cursor:pointer;font-family:var(--font);margin-left:6px;}
.copy-all-btn:hover{border-color:var(--wa);color:var(--wa);}
.market-box{background:#f0fdf4;border:1.5px solid #86efac;border-radius:10px;padding:14px 16px;margin-bottom:8px;}
.market-box.not-found{background:#f9fafb;border-color:var(--border);}
.market-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;}
.market-stat{text-align:center;background:#fff;border-radius:8px;padding:10px;border:1px solid #86efac;}
.market-stat-val{font-size:1.1rem;font-weight:900;color:var(--wa);}
.market-stat-lbl{font-size:.68rem;color:var(--mu);margin-top:2px;}
.market-assessment{font-size:.84rem;color:#15803d;margin-top:8px;font-weight:600;}
.market-note{font-size:.82rem;color:var(--mu);font-style:italic;}
.auth-box{background:#f9fafb;border-radius:10px;padding:14px 16px;}
.auth-score-ring{position:relative;width:60px;height:60px;flex-shrink:0;}
.auth-score-ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.auth-score-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.auth-score-num{font-size:.95rem;font-weight:900;line-height:1;}
.auth-score-den{font-size:.5rem;color:var(--mu);}
.auth-flag{display:flex;align-items:flex-start;gap:6px;font-size:.82rem;margin-bottom:3px;}
.auth-positive{color:#059669;}
.auth-negative{color:#dc2626;}
.auth-disclaimer{font-size:.72rem;color:var(--mu);margin-top:10px;padding-top:8px;border-top:1px solid var(--border);}
.lp-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center;}
.lp-modal{background:#fff;border-radius:16px 16px 0 0;padding:24px 20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;}
.lp-modal-title{font-size:1.1rem;font-weight:900;margin-bottom:16px;color:#1f2937;}
.lp-modal-label{font-size:.72rem;font-weight:800;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px;margin-top:12px;}
.lp-modal-input{width:100%;padding:10px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:.95rem;font-family:var(--font);}
.lp-modal-input:focus{outline:none;border-color:#25D366;}
.lp-check-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#f9fafb;border-radius:8px;margin-top:8px;}
.lp-check-row input{flex-shrink:0;margin-top:2px;}
.lp-modal-btn{display:block;width:100%;padding:15px;background:#25D366;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:800;cursor:pointer;font-family:var(--font);margin-top:16px;}
.lp-modal-btn:disabled{background:#9ca3af;cursor:not-allowed;}
.pdf-section{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:20px;text-align:center;margin-top:20px;}
.pdf-btn{background:var(--gold);color:#fff;border:none;border-radius:var(--r);padding:14px 28px;font-size:1rem;font-weight:900;cursor:pointer;font-family:var(--font);}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:.85rem;font-weight:700;transition:all .3s;opacity:0;z-index:999;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
@media(max-width:480px){.price-grid{grid-template-columns:1fr 1fr;}}
.fq-item{margin-bottom:10px;}
.fq-label{font-size:.75rem;font-weight:700;color:#374151;margin-bottom:4px;display:flex;gap:5px;align-items:center;}
.fq-input{width:100%;padding:8px 10px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:.82rem;font-family:inherit;box-sizing:border-box;}
.fq-input:focus{border-color:#25D366;outline:none;}
.fq-yesno{display:flex;gap:6px;}
.fq-yesno button{flex:1;padding:7px;border-radius:7px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:inherit;border:1.5px solid #e5e7eb;background:#fff;}
.fq-yesno button.on{border-color:#25D366;background:#f0fdf4;color:#15803d;}
.fq-optimize-btn{width:100%;padding:12px;background:linear-gradient(135deg,#1b4332,#25D366);color:#fff;border:none;border-radius:10px;font-size:.88rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:8px;}
.fq-progress{height:5px;background:#e5e7eb;border-radius:3px;margin-bottom:10px;overflow:hidden;}
.fq-progress-bar{height:100%;background:#25D366;border-radius:3px;transition:width .3s;}
.fq-kv-row{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
.fq-kv-label{flex:0 0 140px;padding:7px 10px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:.78rem;font-family:inherit;}
.fq-kv-value{flex:1;padding:7px 10px;border:1.5px solid #e5e7eb;border-radius:7px;font-size:.78rem;font-family:inherit;}
.fq-kv-del{background:none;border:none;color:#9ca3af;cursor:pointer;font-size:.9rem;padding:0 4px;flex-shrink:0;}
.fq-add-kv{display:flex;align-items:center;gap:5px;padding:6px 12px;background:#f9fafb;border:1.5px dashed #d1d5db;border-radius:7px;font-size:.75rem;font-weight:700;color:#6b7280;cursor:pointer;font-family:inherit;width:100%;justify-content:center;margin-top:4px;}
.docs-box{background:#f0f9ff;border:1.5px solid #bfdbfe;border-radius:12px;padding:14px;margin-top:10px;}
.docs-box-title{font-size:.78rem;font-weight:800;color:#1d4ed8;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.doc-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border:1px solid #dbeafe;border-radius:8px;margin-bottom:5px;}
.doc-row-label{flex:1;font-weight:600;color:#1e40af;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc-row-del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:.85rem;padding:0 4px;flex-shrink:0;}
.docs-add-row{display:flex;gap:6px;margin-top:6px;}
.docs-inp{flex:1;padding:7px 10px;border:1.5px solid #bfdbfe;border-radius:7px;font-size:.78rem;font-family:inherit;min-width:0;}
.docs-btn-blue{padding:7px 12px;background:#1d4ed8;color:#fff;border:none;border-radius:7px;font-size:.75rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.docs-btn-light{padding:7px 12px;background:#eff6ff;border:1.5px solid #bfdbfe;color:#1d4ed8;border-radius:7px;font-size:.75rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
/* Fakten-Liste */
.fakten-box{margin:12px 16px;padding:14px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;}
.fakten-title{font-size:.78rem;font-weight:800;color:#374151;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.fakt-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.fakt-key{flex:0 0 140px;padding:6px 8px;background:#fff;border:1.5px solid #e5e7eb;border-radius:6px;font-size:.75rem;font-family:inherit;color:#374151;}
.fakt-val{flex:1;padding:6px 8px;background:#fff;border:1.5px solid #e5e7eb;border-radius:6px;font-size:.75rem;font-family:inherit;color:#111;}
.fakt-val:focus,.fakt-key:focus{border-color:#25D366;outline:none;}
.fakt-del{background:none;border:none;color:#9ca3af;cursor:pointer;font-size:.85rem;padding:0 3px;flex-shrink:0;}
.fakt-del:hover{color:#ef4444;}
.fakt-add{display:flex;align-items:center;gap:5px;padding:6px 10px;background:none;border:1.5px dashed #d1d5db;border-radius:7px;font-size:.75rem;font-weight:700;color:#6b7280;cursor:pointer;font-family:inherit;width:100%;justify-content:center;margin-top:4px;}
.fakt-save{width:100%;padding:11px;background:linear-gradient(135deg,#1b4332,#25D366);color:#fff;border:none;border-radius:10px;font-size:.88rem;font-weight:800;cursor:pointer;font-family:inherit;margin-top:10px;}
/* DNA Banner */
.dna-banner{background:linear-gradient(135deg,#fff7ed,#fef3c7);border:2px solid #f59e0b;border-radius:12px;padding:14px 16px;margin:0 16px 4px;}
.dna-banner-title{font-size:.88rem;font-weight:900;color:#92400e;margin-bottom:4px;}
.dna-banner-sub{font-size:.78rem;color:#78350f;line-height:1.5;}
.dna-complete-banner{background:#f0fdf4;border:1.5px solid #86efac;border-radius:10px;padding:10px 14px;margin:8px 16px;display:flex;align-items:center;gap:8px;font-size:.78rem;color:#15803d;font-weight:700;}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">Dein Verkaufsreport<span id="headerSub">Lade...</span></div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div id="roleBadge" style="display:none;" class="role-badge"></div>
      <div id="deleteInfo" style="font-size:.78rem;opacity:.85;text-align:right;"></div>
    </div>
  </div>
</header>
<div class="main" id="content">
  <div class="loading"><div class="spinner"></div>Lade Ergebnisse...</div>
</div>
<div id="toast"></div>
<script>
var API='https://converto-server-production.up.railway.app';
var TOKEN=new URLSearchParams(location.search).get('s');
var _store={},_storeIdx=0,_lpData={};
function storeText(t){var id='c'+(++_storeIdx);_store[id]=t;return id;}
function esc(s){if(!s&&s!==0)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function getAiMode(){return(window._lastData&&window._lastData.ai_mode)||'sachbearbeiter';}
function hasLPAccess(){return getAiMode()!=='sachbearbeiter';}

if(!TOKEN){document.getElementById('content').innerHTML='<div class="loading">Kein g\u00fcltiger Link</div>';}
else{loadResults();}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');if(!el)return;
  var a=el.getAttribute('data-action');
  if(a==='open-lp-modal')openLPModal(el.getAttribute('data-aid'));
  else if(a==='copy-lp'){copyText(el.getAttribute('data-url'));el.textContent='Kopiert!';setTimeout(function(){el.textContent='Link kopieren';},2000);}
  else if(a==='deactivate-lp')deactivateLP(el.getAttribute('data-lpid'));
  else if(a==='reanalyze'){var aid=el.getAttribute('data-aid');reanalyzeArticle(aid);}
});

function copyWidgetCode(slug){
  var code='<scr'+'ipt src="https://converto-server-production.up.railway.app/widget.js?slug='+slug+'"><'+'/scr'+'ipt>';
  if(navigator.clipboard){navigator.clipboard.writeText(code).then(function(){showToast('\u2705 Widget-Code kopiert!');});}
  else{var ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('\u2705 Kopiert!');}
}

function buildLPButton(article){
  try{
    var lp=_lpData[article.id];
    var an=article.analysis||{};
    var isBusiness=!!(window._lastData&&window._lastData.business_discount_id);
    var isAnalyzed=article.status==='analyzed'&&Object.keys(an).length>2;
    if(lp&&lp.status==='active'){
      var url='https://p.converdino.com/p/'+lp.slug;
      var qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=160x160&data='+encodeURIComponent(url)+'&color=1b4332&bgcolor=ffffff&margin=10';
      var labelUrl=API+'/api/vk/lp/label/'+lp.slug;
      var dnaHtml='';
      if(lp.has_bot&&lp.bot_config){
        var bc=lp.bot_config;
        var nutzen=(bc.feature_benefits||[]).filter(function(f){return f.benefit;}).slice(0,3).map(function(f){return f.benefit;});
        var minPreis=lp.min_price?'EUR '+lp.min_price:'nicht verhandelbar';
        dnaHtml+='<div style="margin-top:10px;padding:14px;background:#f0fdf4;border:1px solid #86efac;border-radius:10px;">';
        dnaHtml+='<div style="font-size:.72rem;font-weight:800;color:#15803d;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">\ud83e\udd16 So arbeitet dein Verkaufsberater</div>';
        dnaHtml+='<div style="font-size:.82rem;color:#374151;line-height:1.6;margin-bottom:8px;">Anrede: <strong>'+(lp.anrede==='du'?'Du':'Sie')+'</strong> | Verhandelbar ab <strong>'+minPreis+'</strong></div>';
        if(nutzen.length)dnaHtml+='<div style="font-size:.8rem;color:#374151;">'+nutzen.map(function(n){return '\u00b7 '+esc(n);}).join('<br>')+'</div>';
        dnaHtml+='</div>';
      }
      var widgetHtml='<div style="margin-top:10px;padding:12px;background:#f0f9ff;border:1.5px solid #bfdbfe;border-radius:10px;">'
        +'<div style="font-size:.72rem;font-weight:800;color:#1d4ed8;margin-bottom:5px;">\ud83d\udd0c Widget-Code f\u00fcr deine Website</div>'
        +'<div style="background:#1e293b;border-radius:6px;padding:8px 10px;font-family:monospace;font-size:.62rem;color:#e2e8f0;word-break:break-all;margin-bottom:6px;">'
        +'&lt;script src=&quot;https://converto-server-production.up.railway.app/widget.js?slug='+lp.slug+'&quot;&gt;&lt;/script&gt;'
        +'</div>'
        +'<button onclick="copyWidgetCode(\''+lp.slug+'\')" style="padding:6px 14px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;font-size:.72rem;font-weight:700;cursor:pointer;">Code kopieren</button>'
        +'</div>';
      return '<div style="margin-top:10px;padding:16px;background:#dcfce7;border:1.5px solid #25D366;border-radius:12px;">'
        +'<div style="font-size:.8rem;font-weight:800;color:#15803d;margin-bottom:10px;">Landingpage aktiv</div>'
        +'<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;">'
        +'<div style="flex-shrink:0;text-align:center;"><img src="'+qrUrl+'" style="width:120px;height:120px;border-radius:8px;border:2px solid #86efac;" alt="QR"><div style="font-size:.68rem;color:#15803d;font-weight:700;margin-top:4px;">Scan \u2192 Produktseite</div></div>'
        +'<div style="flex:1;min-width:180px;"><a href="'+url+'" target="_blank" style="font-size:.82rem;color:#15803d;word-break:break-all;display:block;margin-bottom:10px;">'+url+'</a>'
        +'<div style="display:flex;flex-direction:column;gap:6px;">'
        +'<button data-action="copy-lp" data-url="'+url+'" style="padding:8px 12px;background:#25D366;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:.8rem;">Link kopieren</button>'
        +'<a href="'+labelUrl+'" target="_blank" style="padding:8px 12px;background:#1b4332;color:#fff;border-radius:8px;font-weight:700;font-size:.8rem;text-decoration:none;display:block;">\ud83d\udce6 Produktetikett drucken</a>'
        +'<button onclick="openUpdateLP(\''+lp.id+'\',\''+article.id+'\')" style="padding:6px 12px;background:#f0fdf4;border:1px solid #25D366;color:#15803d;border-radius:8px;font-size:.75rem;cursor:pointer;">\u270f\ufe0f Preis & Einstellungen</button>'
        +'<button data-action="deactivate-lp" data-lpid="'+lp.id+'" style="padding:6px 12px;background:none;border:1px solid #fecaca;color:#ef4444;border-radius:8px;font-size:.75rem;cursor:pointer;">Deaktivieren</button>'
        +'</div></div></div>'
        +widgetHtml+dnaHtml+'</div>';
    }
    var canSeeLP=hasLPAccess()||isBusiness;
    if(!canSeeLP)return'';
    if(article.lp_booked||(isBusiness&&isAnalyzed)){
      window._lpModalData=window._lpModalData||{};
      window._lpModalData[article.id]={price:an.price_recommended||0,title:article.title||'',days:article.lp_days||7,hasBot:!!article.lp_has_bot,authScore:(an.authenticity&&an.authenticity.score!=null)?an.authenticity.score:null};
      return'<button style="display:flex;align-items:center;gap:8px;width:100%;padding:13px 16px;background:#f0fdf4;border:1.5px solid #25D366;border-radius:10px;color:#15803d;font-weight:800;font-size:.9rem;cursor:pointer;font-family:var(--font);margin-top:10px;" data-action="open-lp-modal" data-aid="'+article.id+'">\ud83c\udf10 '+(article.lp_booked?'Landingpage aktivieren':'Landingpage erstellen')+'</button>';
    }
    return'';

async function loadResults(){

// ── KONTROLL-BLOCK ──────────────────────────────────────────────────────
function buildKontrollBlock(a) {
  var an = a.analysis || {};
  var round = an.correction_round || 0;
  var needsEscalation = an.needs_escalation || round >= 3;
  if (a.status !== 'analyzed' || Object.keys(an).length < 3) return '';

  var aid = a.id;
  var html = '';

  if (needsEscalation) {
    html += '<div style="margin:12px 16px;padding:14px 16px;background:#fef2f2;border:2px solid #fecaca;border-radius:12px;">';
    html += '<div style="font-size:.88rem;font-weight:900;color:#991b1b;margin-bottom:4px;">🔧 Persönliche Prüfung erforderlich</div>';
    html += '<div style="font-size:.8rem;color:#7f1d1d;">Wir schauen uns das persönlich an und melden uns bei dir.</div>';
    html += '</div>';
    return html;
  }

  var borderColor = round === 0 ? '#f59e0b' : '#ef4444';
  var bgColor = round === 0 ? '#fffbeb' : '#fef2f2';
  var titleColor = round === 0 ? '#92400e' : '#991b1b';

  html += '<div style="margin:12px 16px;padding:14px 16px;background:' + bgColor + ';border:2px solid ' + borderColor + ';border-radius:12px;">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">';
  html += '<div style="font-size:.88rem;font-weight:900;color:' + titleColor + ';">🔍 Bitte kontrollieren</div>';
  if (round > 0) html += '<div style="font-size:.72rem;background:' + borderColor + ';color:#fff;padding:2px 8px;border-radius:10px;font-weight:800;">Korrektur ' + round + '/2</div>';
  html += '</div>';
  html += '<div style="font-size:.78rem;color:#78350f;margin-bottom:12px;">Stimmt das Ergebnis? Wenn nicht – beschreibe kurz was falsch ist.</div>';
  html += '<textarea id="einspruch-' + aid + '" style="width:100%;padding:10px;border:1.5px solid ' + borderColor + ';border-radius:8px;font-size:.82rem;font-family:inherit;height:70px;resize:vertical;background:#fff;" placeholder="z.B. Kein Elektro, Diesel. KM-Stand ist 150.000, nicht Reichweite. Modell: Peugeot Traveller."></textarea>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">';
  html += '<button onclick="markiereKorrekt(&#39;' + aid + '&#39;)" style="padding:11px;background:#f0fdf4;border:2px solid #25D366;border-radius:10px;font-size:.82rem;font-weight:800;color:#15803d;cursor:pointer;">✅ Alles korrekt</button>';
  html += '<button id="einspruch-btn-' + aid + '" onclick="runEinspruch(&#39;' + aid + '&#39;)" style="padding:11px;background:' + borderColor + ';color:#fff;border:none;border-radius:10px;font-size:.82rem;font-weight:800;cursor:pointer;">⚡ Korrigieren</button>';
  html += '</div>';
  if (round >= 1) html += '<div style="font-size:.72rem;color:#ef4444;margin-top:8px;text-align:center;">Letzte Korrekturmöglichkeit</div>';
  html += '</div>';

  if (a.questions && a.questions.length > 0) {
    var artAnswered = Object.keys(a.answers || {}).filter(function(k){ return (a.answers||{})[k] && k !== 'q_sonstige'; }).length;
    html += '<div style="padding:0 16px 4px;">';
    html += '<button onclick="initFragen(&#39;' + aid + '&#39;)" style="width:100%;padding:9px;background:none;border:1.5px dashed #d1d5db;border-radius:8px;font-size:.78rem;color:#6b7280;cursor:pointer;font-family:inherit;">+ Angaben ergänzen (' + artAnswered + '/' + a.questions.length + ' beantwortet)</button>';
    html += '</div>';
  }
  return html;
}

// ── FAKTEN-LISTE (Verifizierte Paare aus Fotos + Dossier) ───────────────
var _faktenData = {};

async function loadFakten(artId) {
  try {
    var r = await fetch(API + '/api/vk/article/' + artId + '/questions');
    var d = await r.json();
    var answers = d.answers || {};
    var questions = d.questions || [];
    var pairs = [];
    // Strukturierte Antworten
    questions.filter(function(q){ return answers[q.id] && q.id !== 'q_sonstige'; })
      .forEach(function(q){ pairs.push({k: q.label || q.id, v: answers[q.id]}); });
    // Extra-Paare aus Dossier
    var extra = answers['q_extra'] || '';
    if (extra) {
      extra.split(',').forEach(function(pair){
        var trimmed = pair.trim();
        var colonIdx = trimmed.indexOf(':');
        if (colonIdx > 0) pairs.push({k: trimmed.substring(0, colonIdx).trim(), v: trimmed.substring(colonIdx+1).trim()});
      });
    }
    if (answers['q_sonstige']) pairs.push({k: 'Korrektur', v: answers['q_sonstige']});
    _faktenData[artId] = { pairs: pairs, answers: answers, questions: questions };
    renderFakten(artId);
  } catch(e) { console.error('loadFakten:', e); }
}

function renderFakten(artId) {
  var sec = document.getElementById('fakten-' + artId);
  if (!sec) return;
  var fd = _faktenData[artId];
  if (!fd || !fd.pairs.length) {
    sec.innerHTML = '<div style="padding:10px 16px;font-size:.78rem;color:#6b7280;">Noch keine Fakten — Dossier hochladen oder Fragen beantworten.</div>';
    return;
  }
  var html = '<div class="fakten-box">';
  html += '<div class="fakten-title">📋 Gewonnene Informationen <span style="background:#25D366;color:#fff;font-size:.65rem;padding:2px 7px;border-radius:10px;">' + fd.pairs.length + '</span><span style="margin-left:auto;font-size:.68rem;color:#9ca3af;font-weight:600;">Überprüfen, ergänzen oder entfernen</span></div>';
  fd.pairs.forEach(function(p, i) {
    html += '<div class="fakt-row">';
    html += '<input class="fakt-key" value="' + esc(p.k) + '" data-aid="' + artId + '" data-idx="' + i + '" data-field="k" onblur="updateFakt(this)">';
    html += '<input class="fakt-val" value="' + esc(p.v) + '" data-aid="' + artId + '" data-idx="' + i + '" data-field="v" onblur="updateFakt(this)">';
    html += '<button class="fakt-del" onclick="deleteFakt(&#39;' + artId + '&#39;,' + i + ')">&#10005;</button>';
    html += '</div>';
  });
  html += '<button class="fakt-add" onclick="addFakt(&#39;' + artId + '&#39;)">+ Hinzufügen</button>';
  html += '<button class="fakt-save" onclick="saveFaktenAndDNA(&#39;' + artId + '&#39;)">🚀 DNA generieren & speichern</button>';
  html += '</div>';
  sec.innerHTML = html;
}

function updateFakt(input) {
  var aid = input.dataset.aid, idx = parseInt(input.dataset.idx), field = input.dataset.field;
  if (_faktenData[aid]) _faktenData[aid].pairs[idx][field] = input.value;
}
function deleteFakt(artId, idx) {
  if (!_faktenData[artId]) return;
  _faktenData[artId].pairs.splice(idx, 1);
  renderFakten(artId);
}
function addFakt(artId) {
  if (!_faktenData[artId]) _faktenData[artId] = { pairs: [], answers: {}, questions: [] };
  _faktenData[artId].pairs.push({k: '', v: ''});
  renderFakten(artId);
  // Fokus auf neues Feld
  var sec = document.getElementById('fakten-' + artId);
  var inputs = sec ? sec.querySelectorAll('.fakt-key') : [];
  if (inputs.length) inputs[inputs.length-1].focus();
}
async function saveFaktenAndDNA(artId) {
  var fd = _faktenData[artId];
  if (!fd) return;
  var btn = document.querySelector('#fakten-' + artId + ' .fakt-save');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Wird generiert...'; }
  try {
    // Paare zurück in answers schreiben
    var newAnswers = Object.assign({}, fd.answers);
    var extraPairs = [];
    fd.pairs.forEach(function(p) {
      if (!p.k || !p.v) return;
      // Bekannte Felder direkt in answers
      var matchQ = fd.questions.find(function(q){ return q.label === p.k || q.id === p.k; });
      if (matchQ) { newAnswers[matchQ.id] = p.v; }
      else { extraPairs.push(p.k + ': ' + p.v); }
    });
    newAnswers['q_extra'] = extraPairs.join(',');
    // Speichern
    await fetch(API + '/api/vk/article/' + artId + '/answers', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({answers: newAnswers})
    });
    // Step2 Analyse + DNA
    var r = await fetch(API + '/api/vk/article/' + artId + '/analyze-step2', { method: 'POST' });
    var d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Fehler');
    showToast('✅ DNA generiert! Seite wird aktualisiert...');
    setTimeout(function(){ location.reload(); }, 1800);
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '🚀 DNA generieren & speichern'; }
    showToast('❌ ' + e.message);
  }
}

// autoShown=true wenn vom render()-Auto-Init aufgerufen (needs_questions)
async function initFragen(artId,autoShown){
  var sec=document.getElementById('fq-section-'+artId);if(!sec)return;
  if(!autoShown)sec.innerHTML='<div style="text-align:center;padding:16px;color:#6b7280;">⏳ Laden...</div>';
  try{
    var r=await fetch(API+'/api/vk/article/'+artId+'/questions');
    var d=await r.json();
    if(!d.questions||!d.questions.length){
      sec.innerHTML='';
      // Fragen noch nicht generiert → Server generiert sie, kurz warten und nochmal
      if(autoShown){setTimeout(function(){initFragen(artId,true);},3000);}
      return;
    }
    _fqData[artId]={questions:d.questions,answers:d.answers||{},autoShown:!!autoShown};
    renderFQ(artId);
  }catch(e){sec.innerHTML='';}
}

function renderFQ(artId){
  var sec=document.getElementById('fq-section-'+artId);if(!sec)return;
  var fd=_fqData[artId],qs=fd.questions,ans=fd.answers;
  var autoShown=fd.autoShown;
  var answered=qs.filter(function(q){return ans[q.id]&&ans[q.id]!=='';}).length;
  var pct=Math.round(answered/qs.length*100);
  var html='<div style="border:2px solid '+(autoShown?'#f59e0b':'#25D366')+';border-radius:12px;padding:14px;margin:14px 16px;">';
  html+='<div style="font-size:.82rem;font-weight:800;color:'+(autoShown?'#92400e':'#15803d')+';margin-bottom:4px;">'+(autoShown?'📋':'🎯')+' Angaben '+(autoShown?'für KI-Berater ':'')+'— '+answered+'/'+qs.length+'</div>';
  html+='<div class="fq-progress"><div class="fq-progress-bar" style="width:'+pct+'%;background:'+(autoShown?'#f59e0b':'#25D366')+'"></div></div>';
  qs.forEach(function(q){
    var val=ans[q.id]||'',hasVal=val!=='';
    html+='<div class="fq-item"><div class="fq-label">'+esc(q.label)+(q.important?'<span style="background:#fef9c3;color:#92400e;font-size:.62rem;font-weight:800;padding:1px 5px;border-radius:8px;">★</span>':'')+(hasVal?'<button data-aid="'+artId+'" data-qid="'+q.id+'" class="fq-clear-btn" style="margin-left:auto;background:none;border:none;color:#9ca3af;cursor:pointer;">✕</button>':'')+'</div>';
    if(q.type==='yesno'){html+='<div class="fq-yesno">';['Ja','Nein','Weiß nicht'].forEach(function(v,vi){var rawV=['Ja','Nein','Unbekannt'][vi];html+='<button data-aid="'+artId+'" data-qid="'+q.id+'" data-val="'+rawV+'" class="fq-yn-btn'+(val===rawV?' on':'')+'">'+v+'</button>';});html+='</div>';}
    else{html+='<input class="fq-input" type="'+(q.type==='number'?'number':'text')+'" placeholder="'+esc(q.placeholder||'')+'" value="'+esc(val)+'" data-aid="'+artId+'" data-qid="'+q.id+'" onblur="setFQBlur(this)" oninput="updateFQProgress(this.dataset.aid)">';}
    html+='</div>';
  });
  var sonstige=(fd.answers&&fd.answers['q_sonstige'])||'';
  html+='<div class="fq-item"><div class="fq-label">Korrekturen / Sonstiges</div><textarea class="fq-input" data-aid="'+artId+'" data-qid="q_sonstige" onblur="setFQInput(this)" style="height:60px;resize:vertical;width:100%;">'+esc(sonstige)+'</textarea></div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">';
  html+='<button data-aid="'+artId+'" class="fq-save-btn" style="padding:10px;background:#f0fdf4;border:2px solid #25D366;border-radius:10px;font-size:.82rem;font-weight:800;color:#15803d;cursor:pointer;">💾 Speichern</button>';
  html+='<button data-aid="'+artId+'" class="fq-run-btn fq-optimize-btn">⚡ Analysieren</button>';
  html+='</div>';
  if(!autoShown){
    html+='<button data-aid="'+artId+'" class="fq-close-btn" style="width:100%;padding:6px;background:none;border:none;color:#9ca3af;font-size:.75rem;cursor:pointer;margin-top:4px;">Schließen</button>';
  }
  html+='</div>';
  sec.innerHTML=html;
  sec.querySelectorAll('.fq-yn-btn').forEach(function(btn){btn.addEventListener('click',function(){setFQ(this.dataset.aid,this.dataset.qid,this.dataset.val);});});
  sec.querySelectorAll('.fq-clear-btn').forEach(function(btn){btn.addEventListener('click',function(){setFQ(this.dataset.aid,this.dataset.qid,'');});});
  sec.querySelectorAll('.fq-run-btn').forEach(function(btn){btn.addEventListener('click',function(){runStep2(this.dataset.aid);});});
  sec.querySelectorAll('.fq-save-btn').forEach(function(btn){btn.addEventListener('click',function(){saveAnswersOnly(this.dataset.aid);});});
  sec.querySelectorAll('.fq-close-btn').forEach(function(btn){btn.addEventListener('click',function(){var aid=this.dataset.aid;document.getElementById('fq-section-'+aid).innerHTML='<button class="fq-optimize-btn" onclick="initFragen(\''+aid+'\')" style="margin:14px 16px;width:calc(100% - 32px);">🎯 Bericht optimieren</button>';});});
}

function updateFQProgress(artId){var sec=document.getElementById('fq-section-'+artId);if(!sec||!_fqData[artId])return;var fd=_fqData[artId];sec.querySelectorAll('.fq-input').forEach(function(inp){if(inp.dataset.qid)fd.answers[inp.dataset.qid]=inp.value;});var answered=fd.questions.filter(function(q){return fd.answers[q.id]&&fd.answers[q.id]!=='';}).length;var bar=sec.querySelector('.fq-progress-bar');if(bar)bar.style.width=Math.round(answered/fd.questions.length*100)+'%';}
function setFQBlur(inp){setFQ(inp.dataset.aid,inp.dataset.qid,inp.value);}
function setFQInput(inp){setFQ(inp.dataset.aid,inp.dataset.qid,inp.value);}
function setFQ(artId,qId,val){if(!_fqData[artId])return;_fqData[artId].answers[qId]=val;renderFQ(artId);}

async function saveAnswersOnly(artId){
  var fd=_fqData[artId];if(!fd)return;
  var kvs=(_fqKV&&_fqKV[artId])||[];
  var allAns=Object.assign({},fd.answers);
  if(kvs.length)allAns['q_extra']=kvs.filter(function(kv){return kv.k&&kv.v;}).map(function(kv){return kv.k+': '+kv.v;}).join(',');
  await fetch(API+'/api/vk/article/'+artId+'/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:allAns})});
  showToast('✅ Gespeichert — KI-Berater wird aktualisiert...');
  // Im Hintergrund Step2 starten damit DNA neu generiert wird
  fetch(API+'/api/vk/article/'+artId+'/analyze-step2',{method:'POST'}).catch(function(){});
}

async function runStep2(artId){
  var fd=_fqData[artId];if(!fd)return;

    await fetch(API+'/api/vk/article/'+artId+'/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:allAns})});

async function eAddLink(artId){
  var label=(document.getElementById('edoc-label-'+artId)||{}).value||'';
  var url=(document.getElementById('edoc-url-'+artId)||{}).value||'';
  if(!label||!url){alert('Bezeichnung und URL erforderlich');return;}

    await fetch(API+'/api/vk/article/'+artId+'/doc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'link',label:label,url:url})});
    await eLoadDocs(artId);
  }catch(e){alert('Fehler');}
}
function eTrigPDF(artId){document.getElementById('edoc-pdf-'+artId).click();}

async function eUploadPDF(artId,input){
  var file=input.files[0];if(!file)return;
  var label=(document.getElementById('edoc-pdf-label-'+artId)||{}).value||file.name;
  // Button-Feedback
  var btn=input.parentElement.querySelector('.docs-btn-light');
  if(btn){btn.textContent='⏳ Wird analysiert...';btn.disabled=true;}
  var reader=new FileReader();
  reader.onload=async function(){
    var base64=reader.result.split(',')[1];
    try{
      // Über analyze-with-doc → extrahiert Fakten + triggert DNA automatisch
      var r=await fetch(API+'/api/vk/article/'+artId+'/analyze-with-doc',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({pdf_base64:base64,pdf_content_type:file.type,label:label})
      });
      var result=await r.json();
      if(!r.ok)throw new Error(result.error||'Fehler');
      showToast('✅ Analysiert — '+result.facts_count+' Fakten extrahiert. KI-Berater wird aktualisiert.');
      // Fragebogen mit neuen Fakten neu laden
      if(_fqData[artId]){
        _fqData[artId].answers=result.answers||_fqData[artId].answers;
        renderFQ(artId);
      } else {
        setTimeout(function(){initFragen(artId,true);},800);
      }
      await eLoadDocs(artId);
      if(btn){btn.textContent='📄 PDF/Foto hochladen & analysieren';btn.disabled=false;}
    }catch(e){
      showToast('❌ Fehler: '+e.message);
      if(btn){btn.textContent='📄 PDF/Foto hochladen & analysieren';btn.disabled=false;}
    }
  };
  reader.readAsDataURL(file);
}

async function eDeleteDoc(docId,artId){
  if(!confirm('Löschen?'))return;
  await fetch(API+'/api/vk/doc/'+docId,{method:'DELETE'});
  await eLoadDocs(artId);
}
