<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verkaufsreport</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g:#25D366;--g2:#1b4332;--bg:#f0f2f0;--card:#fff;--border:#e5e7eb;--mu:#6b7280;--txt:#1a1a1a;--red:#ef4444;--r:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}
.topbar{background:var(--g2);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.topbar h1{font-size:1rem;font-weight:800;}
.topbar .phone{font-size:.8rem;opacity:.7;}
.main{max-width:640px;margin:0 auto;padding:16px;}

/* POSITION CARD */
.pos-card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px;overflow:hidden;}
.pos-head{background:#f9fafb;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.pos-num{width:26px;height:26px;border-radius:50%;background:var(--g2);color:#fff;font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pos-title-input{flex:1;border:none;background:transparent;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;color:var(--txt);outline:none;}
.pos-del{background:none;border:none;color:#9ca3af;cursor:pointer;font-size:1rem;padding:4px;line-height:1;}
.pos-del:hover{color:var(--red);}
.pos-body{padding:16px;}

/* FOTOS */
.foto-label{font-size:.72rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.foto-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.foto-thumb{width:72px;height:72px;border-radius:8px;overflow:hidden;position:relative;background:#f3f4f6;flex-shrink:0;}
.foto-thumb img{width:100%;height:100%;object-fit:cover;}
.foto-del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.upload-zone{border:2px dashed var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;color:var(--mu);font-size:.82rem;transition:border-color .2s;}
.upload-zone:hover{border-color:var(--g);color:var(--g);}

/* DOCS */
.docs-section{background:#f8faff;border:1.5px solid #bfdbfe;border-radius:8px;padding:12px;margin-top:12px;}
.docs-section .foto-label{color:#1e40af;}
.doc-item{display:flex;align-items:center;gap:8px;font-size:.8rem;padding:4px 0;}
.doc-item a{flex:1;color:#1d4ed8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc-del{background:none;border:none;color:#9ca3af;cursor:pointer;font-size:.85rem;}
.doc-del:hover{color:var(--red);}
.docs-add-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.docs-add-input{flex:1;min-width:120px;padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:.8rem;font-family:'Nunito',sans-serif;}
.docs-pdf-btn{padding:7px 12px;background:#fff;border:1.5px solid #bfdbfe;border-radius:7px;font-size:.8rem;font-weight:700;cursor:pointer;color:#1d4ed8;font-family:'Nunito',sans-serif;white-space:nowrap;}

/* PRODUKTE */
.prod-section{margin-top:14px;border-top:1px solid var(--border);padding-top:14px;}
.prod-label{font-size:.72rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.prod-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6;}
.prod-row:last-child{border-bottom:none;}
.prod-left{display:flex;align-items:center;gap:10px;}
.prod-toggle{width:38px;height:22px;border-radius:11px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.prod-toggle.on{background:var(--g);}
.prod-toggle.off{background:#d1d5db;}
.prod-toggle.disabled{background:#e5e7eb;cursor:not-allowed;}
.prod-toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;transition:left .2s;}
.prod-toggle.on::after{left:19px;}
.prod-toggle.off::after{left:3px;}
.prod-name{font-size:.875rem;font-weight:700;}
.prod-sub{font-size:.72rem;color:var(--mu);}
.prod-price{font-size:.875rem;font-weight:800;color:var(--g2);}
.prod-price.muted{color:#9ca3af;}

/* TAGE */
.days-row{display:flex;gap:6px;margin-top:10px;}
.day-btn{flex:1;padding:8px 4px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-size:.78rem;font-weight:700;cursor:pointer;text-align:center;color:var(--mu);font-family:'Nunito',sans-serif;transition:all .15s;}
.day-btn.on{border-color:var(--g2);background:var(--g2);color:#fff;}
.day-btn small{display:block;font-size:.65rem;font-weight:600;margin-top:1px;}

/* POSITIONSPREIS */
.pos-price-bar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:.82rem;color:var(--mu);}
.pos-price-bar strong{color:var(--txt);font-size:.9rem;}

/* ADD POSITION */
.add-pos-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:2px dashed var(--border);border-radius:var(--r);background:none;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:700;color:var(--mu);cursor:pointer;transition:all .2s;margin-bottom:16px;}
.add-pos-btn:hover{border-color:var(--g);color:var(--g);}

/* ZUSAMMENFASSUNG */
.summary-card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px;margin-bottom:16px;}
.sum-title{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin-bottom:12px;}
.sum-row{display:flex;justify-content:space-between;font-size:.85rem;padding:5px 0;color:var(--mu);}
.sum-row.bold{color:var(--txt);font-weight:700;}
.sum-divider{border:none;border-top:1px solid var(--border);margin:8px 0;}
.sum-total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:900;color:var(--g2);padding-top:6px;}

/* COUPON */
.coupon-row{display:flex;gap:8px;margin-bottom:12px;}
.coupon-input{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.88rem;font-family:'Nunito',sans-serif;text-transform:uppercase;}
.coupon-btn{padding:10px 16px;background:#f0fdf4;border:1.5px solid #86efac;border-radius:8px;font-weight:800;font-size:.82rem;cursor:pointer;color:#15803d;font-family:'Nunito',sans-serif;}
.coupon-msg{font-size:.78rem;margin-bottom:10px;min-height:16px;}

/* CHECKOUT BTN */
.checkout-btn{width:100%;padding:16px;background:var(--g);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 4px 12px rgba(37,211,102,.3);transition:all .2s;}
.checkout-btn:hover{background:#128C7E;}
.checkout-btn:disabled{opacity:.5;cursor:not-allowed;}
.checkout-btn.free{background:var(--g2);}

/* MISC */
.err-box{background:#fef2f2;border:1.5px solid #fecaca;border-radius:10px;padding:16px;margin:20px;text-align:center;color:var(--red);font-weight:700;}
.loading{text-align:center;padding:60px 20px;color:var(--mu);}
.ring{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--g2);color:#fff;padding:10px 20px;border-radius:30px;font-size:.85rem;font-weight:700;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>
<div class="topbar">
  <h1>📋 Verkaufsreport</h1>
  <span class="phone" id="phoneDisplay"></span>
</div>
<div id="app" class="main">
  <div class="loading"><div class="ring"></div>Lade deinen Auftrag...</div>
</div>
<div id="toast"></div>

<script>
const API = 'https://converto-server-production.up.railway.app';
const KEY = 'converto_auth_v2';
let sessionToken = null, sd = null, couponData = null, bizDisc = null;
let PRICES = { report: 1.00, lp: 1.00, bot: 2.00 };
// Per-Artikel State (lokal)
let artState = {}; // { [id]: { days:7, lp:false, bot:false } }

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function showErr(msg){document.getElementById('app').innerHTML='<div class="err-box">⚠ '+msg+'</div>';}

function getState(id){
  if(!artState[id]) artState[id] = {days:7, lp:false, bot:false};
  return artState[id];
}

// Preis pro Artikel
function calcArtPrice(id){
  var s = getState(id);
  var weeks = s.days / 7;
  var p = PRICES.report * weeks;
  if(s.lp) p += PRICES.lp * weeks;
  if(s.lp && s.bot) p += PRICES.bot * weeks;
  return Math.round(p * 100) / 100;
}

function calcNet(){
  var arts = sd?.articles || [];
  return Math.round(arts.reduce((t,a) => t + calcArtPrice(a.id), 0) * 100) / 100;
}

function fmt(v){return '€ '+v.toFixed(2);}

// ── INIT ─────────────────────────────────────────────
(function(){
  sessionToken = new URLSearchParams(location.search).get('s');
  if(!sessionToken){ showErr('Kein Auftrag gefunden.'); return; }
  Promise.all([
    fetch(API+'/api/vk/pricing').then(r=>r.json()).catch(()=>null),
    fetch(API+'/api/vk/session/'+sessionToken).then(r=>r.json()),
    fetch(API+'/api/vk/session/'+sessionToken+'/discount').then(r=>r.json()).catch(()=>null)
  ]).then(([prices, session, disc]) => {
    if(prices && prices.report) PRICES = prices;
    if(!session || session.error){ showErr(session?.error||'Session nicht gefunden'); return; }
    sd = session;
    bizDisc = disc?.has_discount ? disc : null;
    document.getElementById('phoneDisplay').textContent = sd.phone || '';
    if(sd.status === 'analyzing' || sd.status === 'done'){
      location.href = 'ergebnis.html?s=' + sessionToken; return;
    }
    // State aus gespeicherten Artikeldaten laden
    (sd.articles||[]).forEach(a => {
      artState[a.id] = {
        days: a.lp_days || 7,
        lp: !!a.lp_booked,
        bot: !!a.lp_has_bot
      };
    });
    render();
  }).catch(e => showErr('Verbindungsfehler: '+e.message));
})();

// ── RENDER ────────────────────────────────────────────
function render(){
  var arts = sd?.articles || [];
  var html = '';

  arts.forEach((a,idx) => {
    var s = getState(a.id);
    var photos = a.vk_photos || [];
    var artPrice = calcArtPrice(a.id);

    html += '<div class="pos-card" id="art-'+a.id+'">';

    // Header
    html += '<div class="pos-head">';
    html += '<div class="pos-num">'+(idx+1)+'</div>';
    html += '<input class="pos-title-input" value="'+esc(a.title||'Position '+(idx+1))+'" placeholder="Bezeichnung..." onblur="saveTitle(\''+a.id+'\',this.value)" onkeydown="if(event.key===\'Enter\')this.blur()">';
    html += '<button class="pos-del" onclick="delArt(\''+a.id+'\')" title="Position löschen">✕</button>';
    html += '</div>';

    html += '<div class="pos-body">';

    // Fotos
    html += '<div class="foto-label">Fotos</div>';
    html += '<div class="foto-grid" id="fg-'+a.id+'">';
    photos.forEach(p => {
      html += '<div class="foto-thumb">';
      html += '<img src="'+esc(p.public_url)+'" loading="lazy">';
      html += '<button class="foto-del" onclick="delPhoto(\''+p.id+'\')">✕</button>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="upload-zone" onclick="trigUpload(\''+a.id+'\')">📷 Fotos auswählen oder hierher ziehen</div>';

    // Dokumente
    html += '<div class="docs-section" id="docs-'+a.id+'">';
    html += '<div class="foto-label" style="color:#1e40af">Dokumente</div>';
    html += '<div id="doc-list-'+a.id+'"></div>';
    html += '<div class="docs-add-row">';
    html += '<input class="docs-add-input" id="doc-pdf-label-'+a.id+'" placeholder="Bezeichnung (z.B. Rechnung)">';
    html += '<button class="docs-pdf-btn" onclick="trigDocPDF(\''+a.id+'\')">📄 PDF hochladen</button>';
    html += '<input type="file" id="doc-pdf-'+a.id+'" accept=".pdf,.jpg,.jpeg,.png" style="display:none" onchange="uploadDocPDF(\''+a.id+'\',this)">';
    html += '</div></div>';

    // Produkte
    html += '<div class="prod-section">';
    html += '<div class="prod-label">Leistungen</div>';

    // Report (immer)
    html += '<div class="prod-row">';
    html += '<div class="prod-left"><div style="width:38px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><span style="color:var(--g);font-size:1.1rem;">✓</span></div><div><div class="prod-name">📊 Analyse-Report</div><div class="prod-sub">Immer enthalten</div></div></div>';
    html += '<div class="prod-price">'+fmt(PRICES.report)+' / 7 Tage</div>';
    html += '</div>';

    // LP
    var lpOn = s.lp;
    html += '<div class="prod-row">';
    html += '<div class="prod-left"><button class="prod-toggle '+(lpOn?'on':'off')+'" onclick="togLP(\''+a.id+'\')"></button><div><div class="prod-name">🌐 Landingpage</div><div class="prod-sub">Individuelle Verkaufsseite</div></div></div>';
    html += '<div class="prod-price '+(lpOn?'':'muted')+'">'+fmt(PRICES.lp)+' / 7 Tage</div>';
    html += '</div>';

    // Bot (nur wenn LP)
    var botOn = s.lp && s.bot;
    html += '<div class="prod-row">';
    html += '<div class="prod-left"><button class="prod-toggle '+(botOn?'on':s.lp?'off':'disabled')+'" onclick="togBot(\''+a.id+'\')" '+(s.lp?'':'disabled')+'></button><div><div class="prod-name">🤖 WhatsApp-Bot</div><div class="prod-sub">'+(s.lp?'Digitaler Verkaufsberater':'Landingpage zuerst aktivieren')+'</div></div></div>';
    html += '<div class="prod-price '+(botOn?'':'muted')+'">'+fmt(PRICES.bot)+' / 7 Tage</div>';
    html += '</div>';

    // Tage
    html += '<div class="days-row">';
    [7,14,21,28].forEach(d => {
      var weeks = d/7;
      var dayPrice = Math.round((PRICES.report + (s.lp?PRICES.lp:0) + (botOn?PRICES.bot:0)) * weeks * 100)/100;
      html += '<button class="day-btn '+(s.days===d?'on':'')+'" onclick="setDays(\''+a.id+'\','+d+')">';
      html += d+' Tage<small>'+fmt(dayPrice)+'</small>';
      html += '</button>';
    });
    html += '</div>';

    // Positionspreis
    html += '<div class="pos-price-bar"><span>Positionspreis</span><strong>'+fmt(artPrice)+'</strong></div>';

    html += '</div></div>'; // pos-body + pos-card
  });

  // Neue Position Button
  html += '<button class="add-pos-btn" onclick="addArt()">+ Neue Position</button>';

  // Zusammenfassung
  var net = calcNet();
  var discount = 0;
  if(bizDisc?.has_discount && bizDisc.percent > 0){
    discount = bizDisc.percent >= 100 ? net : Math.round(net * bizDisc.percent / 100 * 100) / 100;
  } else if(couponData?.discount > 0){
    discount = Math.min(couponData.discount, net);
  }
  var afterDiscount = Math.max(0, Math.round((net - discount) * 100) / 100);
  var mwst = Math.round(afterDiscount * 0.20 * 100) / 100;
  var gross = Math.round((afterDiscount + mwst) * 100) / 100;

  html += '<div class="summary-card">';
  html += '<div class="sum-title">Zusammenfassung</div>';
  (sd?.articles||[]).forEach(a => {
    html += '<div class="sum-row"><span>'+esc(a.title||'Position')+'</span><span>'+fmt(calcArtPrice(a.id))+'</span></div>';
  });
  html += '<hr class="sum-divider">';
  html += '<div class="sum-row bold"><span>Netto</span><span>'+fmt(net)+'</span></div>';
  if(discount > 0){
    html += '<div class="sum-row" style="color:#059669"><span>'+(bizDisc?.has_discount?'🏢 Firmenrabatt':'🎫 Gutschein')+'</span><span>-'+fmt(discount)+'</span></div>';
  }
  html += '<div class="sum-row"><span>MwSt 20%</span><span>'+fmt(mwst)+'</span></div>';
  html += '<div class="sum-total"><span>Gesamt</span><span>'+fmt(gross)+'</span></div>';
  html += '</div>';

  // Coupon
  if(!bizDisc?.has_discount){
    html += '<div class="coupon-row"><input class="coupon-input" id="coupon-inp" placeholder="GUTSCHEIN CODE"><button class="coupon-btn" onclick="applyCoupon()">Einlösen</button></div>';
    html += '<div class="coupon-msg" id="coupon-msg"></div>';
  }

  // Checkout Button
  var isFree = bizDisc?.has_discount && bizDisc.percent >= 100;
  var hasArts = (sd?.articles||[]).length > 0;
  if(isFree){
    html += '<button class="checkout-btn free" onclick="doCheckout()" '+(hasArts?'':'disabled')+'>🎁 Kostenlos einlösen (Firmenrabatt)</button>';
  } else {
    html += '<button class="checkout-btn" onclick="doCheckout()" '+(hasArts?'':'disabled')+'>Jetzt bezahlen — '+fmt(gross)+' →</button>';
  }

  document.getElementById('app').innerHTML = html;

  // Docs laden
  (sd?.articles||[]).forEach(a => loadDocs(a.id));

  // Drag & Drop
  setupDropZones();
}

// ── TOGGLE ────────────────────────────────────────────
function togLP(id){
  var s = getState(id);
  s.lp = !s.lp;
  if(!s.lp) s.bot = false;
  saveLPState(id);
  render();
}

function togBot(id){
  var s = getState(id);
  if(!s.lp) return;
  s.bot = !s.bot;
  saveLPState(id);
  render();
}

function setDays(id, d){
  getState(id).days = d;
  saveLPState(id);
  render();
}

function saveLPState(id){
  var s = getState(id);
  fetch(API+'/api/vk/article/'+id+'/notes', {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ lp_booked: s.lp, lp_days: s.days, lp_has_bot: s.bot })
  }).catch(()=>{});
}

// ── ARTIKEL ───────────────────────────────────────────
async function addArt(){
  try{
    var r = await fetch(API+'/api/vk/article', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({token:sessionToken, title:'Neue Position'})});
    var d = await r.json();
    var r2 = await fetch(API+'/api/vk/session/'+sessionToken);
    sd = await r2.json();
    render();
    setTimeout(()=>{ var el=document.getElementById('art-'+(d.article?.id||'')); if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); },100);
  }catch(e){ toast('Fehler: '+e.message); }
}

async function delArt(id){
  if(!confirm('Position löschen?')) return;
  try{
    var r = await fetch(API+'/api/vk/article/'+id, {method:'DELETE'});
    if(!r.ok) throw new Error();
    delete artState[id];
    var r2 = await fetch(API+'/api/vk/session/'+sessionToken);
    sd = await r2.json();
    render();
  }catch(e){ alert('Fehler beim Löschen'); }
}

async function saveTitle(id, title){
  if(!title.trim()) return;
  if(sd?.articles) sd.articles.forEach(a=>{ if(a.id===id) a.title=title.trim(); });
  try{ await fetch(API+'/api/vk/article/'+id+'/notes', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:title.trim()})}); }catch(e){}
}

// ── FOTOS ─────────────────────────────────────────────
function trigUpload(artId){
  var inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange = async() => { if(inp.files) await uploadPhotos(artId, Array.from(inp.files)); };
  inp.click();
}

async function uploadPhotos(artId, files){
  toast('⏳ '+files.length+' Foto(s) werden hochgeladen...');
  for(var i=0;i<files.length;i++){
    var b64 = await toBase64(files[i]);
    await fetch(API+'/api/vk/photo', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({article_id:artId, session_id:sd.id, image_base64:b64, content_type:files[i].type||'image/jpeg'})});
  }
  var r2 = await fetch(API+'/api/vk/session/'+sessionToken);
  sd = await r2.json();
  render();
  toast('✓ '+files.length+' Foto(s) hochgeladen');
}

async function delPhoto(pid){
  if(!confirm('Foto löschen?')) return;
  try{
    var r = await fetch(API+'/api/vk/photo/'+pid, {method:'DELETE'});
    if(!r.ok) throw new Error();
    var r2 = await fetch(API+'/api/vk/session/'+sessionToken);
    sd = await r2.json();
    render();
  }catch(e){ alert('Fehler: '+e.message); }
}

function setupDropZones(){
  document.querySelectorAll('.upload-zone').forEach(function(zone){
    zone.ondragenter = function(e){ e.preventDefault(); e.stopPropagation(); zone.style.borderColor='var(--g)'; zone.style.background='#f0fdf4'; };
    zone.ondragover = function(e){ e.preventDefault(); e.stopPropagation(); zone.style.borderColor='var(--g)'; zone.style.background='#f0fdf4'; };
    zone.ondragleave = function(e){ e.stopPropagation(); zone.style.borderColor=''; zone.style.background=''; };
    zone.ondrop = async function(e){
      e.preventDefault(); e.stopPropagation();
      zone.style.borderColor=''; zone.style.background='';
      var card = zone.closest('.pos-card');
      if(!card) return;
      var artId = card.id.replace('art-','');
      var files = Array.from(e.dataTransfer.files).filter(function(f){ return f.type.startsWith('image/'); });
      if(files.length) await uploadPhotos(artId, files);
    };
  });
}

// ── DOKUMENTE ─────────────────────────────────────────
async function loadDocs(artId){
  try{
    var r = await fetch(API+'/api/vk/article/'+artId+'/docs');
    var docs = await r.json();
    var el = document.getElementById('doc-list-'+artId);
    if(!el) return;
    if(!docs.length){ el.innerHTML=''; return; }
    el.innerHTML = docs.map(d=>'<div class="doc-item"><span>📄 '+esc(d.label)+'</span><button class="doc-del" onclick="deleteDoc(\''+d.id+'\',\''+artId+'\')">✕</button></div>').join('');
  }catch(e){}
}

function trigDocPDF(artId){
  document.getElementById('doc-pdf-'+artId).click();
}

async function uploadDocPDF(artId, input){
  var file = input.files[0]; if(!file) return;
  var label = (document.getElementById('doc-pdf-label-'+artId)||{}).value||file.name;
  if(!label){ alert('Bitte Bezeichnung eingeben'); return; }
  var reader = new FileReader();
  reader.onload = async function(){
    var base64 = reader.result.split(',')[1];
    try{
      await fetch(API+'/api/vk/article/'+artId+'/doc', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({type:'pdf', label, file_base64:base64, file_name:file.name, content_type:file.type, session_id:sd?.id})});
      await loadDocs(artId);
      toast('✓ Dokument hochgeladen');
      var inp = document.getElementById('doc-pdf-label-'+artId);
      if(inp) inp.value = '';
    }catch(e){ alert('Fehler: '+e.message); }
  };
  reader.readAsDataURL(file);
}

async function deleteDoc(docId, artId){
  if(!confirm('Dokument löschen?')) return;
  await fetch(API+'/api/vk/doc/'+docId, {method:'DELETE'});
  await loadDocs(artId);
}

// ── COUPON ────────────────────────────────────────────
async function applyCoupon(){
  var code = (document.getElementById('coupon-inp')?.value||'').trim().toUpperCase();
  var msg = document.getElementById('coupon-msg');
  if(!code) return;
  try{
    var r = await fetch(API+'/api/vk/coupon/validate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code, token:sessionToken})});
    var d = await r.json();
    if(!r.ok||!d.coupon){ msg.style.color='#991b1b'; msg.textContent=d.error||'Ungültiger Code'; return; }
    couponData = {code, discount:d.coupon.discount};
    msg.style.color='#065f46'; msg.textContent='✓ Rabatt: €'+d.coupon.discount.toFixed(2);
    render();
  }catch(e){ msg.style.color='#991b1b'; msg.textContent='Fehler'; }
}

// ── CHECKOUT ──────────────────────────────────────────
async function doCheckout(){
  var arts = sd?.articles||[];
  if(!arts.length){ alert('Keine Artikel vorhanden'); return; }

  // LP State speichern
  var articleModes = {};
  arts.forEach(a => {
    var s = getState(a.id);
    articleModes[a.id] = 'abteilungsleiter';
    // LP state bereits gespeichert via saveLPState
  });

  var isFree = bizDisc?.has_discount && bizDisc.percent >= 100;

  try{
    if(isFree){
      var r = await fetch(API+'/api/vk/business-free', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({token:sessionToken, article_modes:articleModes})});
      var d = await r.json();
      if(d.success||d.redirect) location.href = 'ergebnis.html?s='+sessionToken;
      else alert(d.error||'Fehler');
    } else {
      var body = {token:sessionToken, article_modes:articleModes};
      if(couponData) body.coupon_code = couponData.code;
      var r = await fetch(API+'/api/vk/checkout', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      var d = await r.json();
      if(d.url) location.href = d.url;
      else alert(d.error||'Fehler');
    }
  }catch(e){ alert('Fehler: '+e.message); }
}

// ── HELPER ────────────────────────────────────────────
function toBase64(file){
  return new Promise((res,rej)=>{ var r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
}
