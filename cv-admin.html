<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Converdino — Kundenverwaltung</title>
<style>
  :root {
    --g: #25D366; --g2: #128C7E; --dark: #1a2e24;
    --bg: #f0f4f2; --card: #fff; --border: #e2e8e4;
    --text: #1a2e24; --mu: #6b7e74; --red: #dc2626; --amber: #d97706;
    --r: 14px; --shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  .nav { background: var(--dark); color: #fff; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; }
  .nav .logo { font-size: 22px; font-weight: 800; }
  .nav .logo span { color: var(--g); }
  .nav .right { display: flex; align-items: center; gap: 16px; font-size: 14px; }
  .nav a, .nav button { color: #fff; background: rgba(255,255,255,.12); border: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; text-decoration: none; font-weight: 600; }
  .nav a:hover, .nav button:hover { background: rgba(255,255,255,.22); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }
  h1 { font-size: 26px; margin-bottom: 4px; }
  .sub { color: var(--mu); margin-bottom: 28px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: 24px; margin-bottom: 24px; }
  .card h2 { font-size: 18px; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--mu); margin-bottom: 6px; }
  input { width: 100%; padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; font-family: inherit; }
  input:focus { outline: none; border-color: var(--g); }
  .field { margin-bottom: 16px; }
  .btn { background: var(--g); color: #fff; border: none; padding: 13px 26px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn:hover { background: var(--g2); }
  .btn:hover { opacity: .92; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-g { background: var(--g); }
  .btn-sm { padding: 8px 16px; font-size: 14px; }
  .pwbox { display: flex; gap: 8px; }
  .pwbox input { font-family: monospace; letter-spacing: .5px; }
  .pwbox button { white-space: nowrap; background: var(--g2); color: #fff; border: none; border-radius: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; font-size: 14px; }
  .msg { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; display: none; }
  .msg.ok { background: #e7f8ee; color: #0f7a3d; display: block; }
  .msg.err { background: #fdecec; color: var(--red); display: block; }
  .kc-head-btns { display: flex; gap: 8px; flex-shrink: 0; }
  .slot-view { margin: 14px 0; padding: 14px; background: #f7faf8; border: 1px solid var(--border); border-radius: 12px; }
  .sv-slot { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .sv-slot:last-child { border-bottom: none; }
  .sv-num { width: 26px; height: 26px; border-radius: 50%; background: var(--dark); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .sv-info { flex: 1; }
  .sv-title { font-weight: 600; font-size: 14px; }
  .sv-sub { font-size: 12px; color: var(--mu); }
  .sv-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px 38px; }
  .sv-edit-bar { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed var(--border); }
  .funnel { display: flex; align-items: center; justify-content: space-between; gap: 4px; background: #f7faf8; border: 1px solid #d8e6df; border-radius: 10px; padding: 10px 8px; margin: 0 0 12px 38px; }
  .funnel-step { flex: 1; text-align: center; }
  .funnel-num { font-size: 22px; font-weight: 900; color: var(--dark); line-height: 1; }
  .funnel-num.funnel-lead { color: #b45309; }
  .funnel-num.funnel-deal { color: var(--g2); }
  .funnel-lbl { font-size: 10px; font-weight: 700; color: var(--mu); text-transform: uppercase; letter-spacing: .03em; margin-top: 3px; }
  .funnel-arrow { color: #b8cabf; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  /* Gespräche im Slot-Einblick */
  .slot-conv { margin: 4px 0 10px 38px; }
  .sc-box { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; max-height: 280px; overflow-y: auto; }
  .sc-count { position: sticky; top: 0; background: #fff; font-size: 11px; font-weight: 800; color: var(--mu); text-transform: uppercase; letter-spacing: .04em; padding: 6px 2px; border-bottom: 1px solid var(--border); }
  .sc-item { border-bottom: 1px solid #eef3f0; padding: 8px 4px; cursor: pointer; border-radius: 8px; }
  .sc-item:last-child { border-bottom: none; }
  .sc-item:hover { background: #f4f8f6; }
  .sc-buyer { font-weight: 700; font-size: 13px; color: var(--dark); }
  .sc-meta { font-size: 11px; color: var(--mu); }
  .sc-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .sc-badge { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 20px; }
  .scb-lead { background: #fef3c7; color: #92670c; }
  .scb-deal { background: #dcfce7; color: #166534; }
  .scb-paid { background: var(--g); color: #fff; }
  .scb-lost { background: #fee2e2; color: #991b1b; }
  .scb-mu   { background: #e5eee9; color: #4a5d54; }
  /* Modal */
  .cv-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
  .cv-modal-overlay.open { display: flex; }
  .cv-modal { background: #fff; border-radius: 16px; max-width: 480px; width: 100%; max-height: 88vh; display: flex; flex-direction: column; }
  .cv-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .cv-modal-title { font-weight: 800; font-size: 16px; }
  .cv-modal-close { background: none; border: none; font-size: 24px; color: var(--mu); cursor: pointer; line-height: 1; }
  .cv-modal-body { padding: 18px 20px; overflow-y: auto; }
  .cm-result { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .cm-row { margin-bottom: 8px; display: flex; }
  .cm-row.buyer { justify-content: flex-start; }
  .cm-row.bot { justify-content: flex-end; }
  .cm-bubble { max-width: 82%; padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .cm-row.buyer .cm-bubble { background: #f1f5f3; border: 1px solid var(--border); border-bottom-left-radius: 3px; color: var(--dark); }
  .cm-row.bot .cm-bubble { background: var(--g); color: #fff; border-bottom-right-radius: 3px; }
  .sc-empty { font-size: 13px; color: var(--mu); text-align: center; padding: 10px; }
  /* Wissen */
  .kv-block { margin-bottom: 16px; }
  .kv-label { font-size: 12px; font-weight: 800; color: var(--g2); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 5px; }
  .kv-val { font-size: 14px; color: var(--text); line-height: 1.5; }
  .kv-list { margin: 0; padding-left: 18px; }
  .kv-list li { margin-bottom: 6px; font-size: 14px; line-height: 1.45; }
  .kv-empty { color: var(--mu); font-size: 14px; }
  /* Einstellungen */
  .sett-table { display: flex; flex-direction: column; }
  .sett-row { display: flex; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .sett-row:last-child { border-bottom: none; }
  .sett-label { font-size: 13px; color: var(--mu); font-weight: 700; }
  .sett-val { font-size: 14px; font-weight: 800; text-align: right; word-break: break-word; }
  .kunden-suche { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .kunden-suche input { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; font-family: inherit; }
  .kunden-suche input:focus { outline: none; border-color: var(--g); }
  .suche-count { font-size: 13px; color: var(--mu); white-space: nowrap; }
  .kunden-liste { display: flex; flex-direction: column; gap: 16px; }
  .kunde-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 20px 22px; box-shadow: var(--shadow); }
  .kc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .kc-company { font-size: 18px; font-weight: 800; color: var(--text); }
  .kc-login { margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .kc-meta { color: var(--mu); font-size: 14px; margin-top: 10px; }
  .kc-stats { display: flex; gap: 28px; margin: 16px 0; padding: 14px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .kc-stat { display: flex; flex-direction: column; }
  .kc-num { font-size: 22px; font-weight: 800; color: var(--g2); line-height: 1.1; }
  .kc-lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--mu); margin-top: 2px; }
  .kc-slots { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kc-slots-lbl { font-size: 13px; font-weight: 600; color: var(--mu); }
  .kc-slots input { width: 90px; padding: 8px 10px; text-align: center; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .tag-green { background: #e7f8ee; color: #0f7a3d; }
  .tag-mu { background: #eef2f0; color: var(--mu); }
  .login-name { font-family: monospace; font-weight: 700; }
  .btn-red { background: var(--red); }
  .btn-dark { background: var(--g2); }
  .btn-dark:hover { background: var(--dark); }
  .edit-panel { border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px; }
  .edit-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .edit-grid label { font-size: 12px; }
  .edit-actions { margin-bottom: 16px; }
  .edit-sub { border-top: 1px solid var(--border); padding-top: 14px; margin-bottom: 14px; }
  .edit-sub label { font-size: 12px; }
  .pwreset { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pwreset input { width: 220px; font-family: monospace; }
  .edit-danger { border-top: 1px solid var(--border); padding-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  @media (max-width: 720px) { .edit-grid { grid-template-columns: 1fr; } }
  .slot-cell { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .slot-cell input { width: 80px; padding: 7px 9px; text-align: center; }
  .empty { text-align: center; color: var(--mu); padding: 40px 0; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 720px) { .grid, .grid-3 { grid-template-columns: 1fr; } .wrap { padding: 20px 14px 50px; } .kc-head { flex-direction: column; } }
</style>
</head>
<body>

<div class="nav">
  <div class="logo">Conver<span>dino</span> · Kundenverwaltung</div>
  <div class="right">
    <span id="navUser">admin</span>
    <a href="cv-dashboard.html">← Mein Dashboard</a>
    <button type="button" onclick="logout()">Ausloggen</button>
  </div>
</div>

<div class="wrap">
  <h1>Kundenverwaltung</h1>
  <div class="sub">Neue Converdino-Kunden anlegen und Bot-Slots zuweisen.</div>

  <!-- Neuer Kunde -->
  <div class="card">
    <h2>➕ Neuen Kunden anlegen</h2>
    <div id="createMsg" class="msg"></div>
    <div class="grid">
      <div class="field">
        <label>Login-Name *</label>
        <input id="f-login" placeholder="z. B. autohaus-mueller" autocomplete="off">
      </div>
      <div class="field">
        <label>Passwort *</label>
        <div class="pwbox">
          <input id="f-pw" placeholder="Passwort">
          <button type="button" onclick="suggestPw()">Vorschlag</button>
        </div>
      </div>
    </div>
    <div class="grid">
      <div class="field">
        <label>Firmenname</label>
        <input id="f-company" placeholder="z. B. Autohaus Müller GmbH">
      </div>
      <div class="field">
        <label>Ansprechpartner</label>
        <input id="f-contact" placeholder="z. B. Hans Müller">
      </div>
    </div>
    <div class="grid-3">
      <div class="field">
        <label>Telefon</label>
        <input id="f-phone" placeholder="+43 …">
      </div>
      <div class="field">
        <label>E-Mail (für Benachrichtigungen)</label>
        <input id="f-email" placeholder="kunde@firma.at">
      </div>
      <div class="field">
        <label>Provision %</label>
        <input id="f-commission" placeholder="z. B. 10" inputmode="decimal">
      </div>
    </div>
    <button type="button" class="btn" id="createBtn" onclick="createCustomer()">Kunde anlegen</button>
  </div>

  <!-- Kundenliste -->
  <div class="card">
    <h2>📋 Kunden</h2>
    <div class="kunden-suche">
      <input type="text" id="kundenSuche" placeholder="🔍 Kunde suchen (Login, Firma, Ansprechpartner) …" oninput="filterKunden()">
      <span id="sucheCount" class="suche-count"></span>
    </div>
    <div id="listMsg" class="msg"></div>
    <div id="listArea">
      <div class="empty">Lade Kunden …</div>
    </div>
  </div>
</div>

<div class="cv-modal-overlay" id="convModal">
  <div class="cv-modal">
    <div class="cv-modal-head">
      <div class="cv-modal-title" id="convModalTitle">💬 Gespräch</div>
      <button class="cv-modal-close" onclick="closeConvModal()">×</button>
    </div>
    <div class="cv-modal-body" id="convModalBody"></div>
  </div>
</div>

<script>
const API = 'https://converto-server-production.up.railway.app';
const AUTH_KEY = 'converto_auth_v2';
let auth = null;

// ── LOGIN-SCHUTZ (gleiche Logik wie cv-dashboard) ──
(function init() {
  try { auth = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); }
  catch(e) { auth = null; }

  if (!auth || !auth.role) {
    window.location.href = 'login.html?redirect=cv-admin.html';
    return;
  }
  if (auth.loggedInAt) {
    var ageMs = Date.now() - new Date(auth.loggedInAt).getTime();
    if (ageMs > 12 * 60 * 60 * 1000) {
      localStorage.removeItem(AUTH_KEY);
      window.location.href = 'login.html?redirect=cv-admin.html';
      return;
    }
  }
  document.getElementById('navUser').textContent = auth.username || auth.name || 'admin';
  suggestPw();
  loadCustomers();
})();

function logout() {
  localStorage.removeItem(AUTH_KEY);
  window.location.href = 'login.html';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showMsg(id, text, ok) {
  const el = document.getElementById(id);
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.textContent = text;
}
function clearMsg(id) {
  const el = document.getElementById(id);
  el.className = 'msg';
  el.textContent = '';
}

// ── Passwort-Vorschlag ──
function suggestPw() {
  const chars = 'abcdefghjkmnpqrstuvwxyz';
  const nums = '23456789';
  const all = chars + chars.toUpperCase() + nums;
  let pw = '';
  for (let i = 0; i < 10; i++) pw += all[Math.floor(Math.random() * all.length)];
  document.getElementById('f-pw').value = pw;
}

// ── Kunde anlegen ──
async function createCustomer() {
  clearMsg('createMsg');
  const body = {
    user_login: document.getElementById('f-login').value.trim(),
    password: document.getElementById('f-pw').value.trim(),
    company_name: document.getElementById('f-company').value.trim(),
    contact_name: document.getElementById('f-contact').value.trim(),
    contact_phone: document.getElementById('f-phone').value.trim(),
    seller_email: document.getElementById('f-email').value.trim(),
    commission_pct: document.getElementById('f-commission').value.trim()
  };
  if (!body.user_login || !body.password) {
    showMsg('createMsg', 'Login-Name und Passwort sind erforderlich.', false);
    return;
  }

  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Lege an …';

  try {
    const r = await fetch(API + '/api/cv/admin/customers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok || !d.success) {
      showMsg('createMsg', d.error || 'Anlegen fehlgeschlagen.', false);
    } else {
      showMsg('createMsg', '✅ Kunde "' + body.user_login + '" angelegt. Login: ' +
        body.user_login + ' / Passwort: ' + body.password + '  (bitte notieren!)', true);
      // Formular leeren
      ['f-login','f-company','f-contact','f-phone','f-email','f-commission']
        .forEach(id => document.getElementById(id).value = '');
      suggestPw();
      loadCustomers();
    }
  } catch(e) {
    showMsg('createMsg', 'Verbindungsfehler: ' + e.message, false);
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Kunde anlegen';
  }
}

// ── Kundenliste laden ──
async function loadCustomers() {
  clearMsg('listMsg');
  const area = document.getElementById('listArea');
  try {
    const r = await fetch(API + '/api/cv/admin/customers');
    const d = await r.json();
    const list = d.customers || [];
    if (list.length === 0) {
      area.innerHTML = '<div class="empty">Noch keine Kunden angelegt.</div>';
      return;
    }
    let cards = '';
    for (const c of list) {
      const company = c.company_name || c.user_login;
      const contact = c.contact_name || '';
      const phone = c.contact_phone || '';
      const email = c.seller_email || '';
      const comm = (c.commission_pct != null) ? (c.commission_pct + ' %') : '—';
      const isActive = c.status === 'active';
      const statusTag = isActive
        ? '<span class="tag tag-green">aktiv</span>'
        : '<span class="tag tag-mu">' + esc(c.status) + '</span>';

      // Kontaktzeile sauber zusammensetzen (nur was da ist)
      const metaParts = [];
      if (contact) metaParts.push(esc(contact));
      if (phone)   metaParts.push(esc(phone));
      if (email)   metaParts.push(esc(email));
      const metaLine = metaParts.length ? metaParts.join('&nbsp;·&nbsp;') : '<span style="color:var(--mu)">keine Kontaktdaten</span>';

      // Durchsuchbarer Text (klein geschrieben) für die Suchleiste
      const sucheText = (c.user_login + ' ' + (c.company_name || '') + ' ' + (c.contact_name || '') + ' ' + (c.contact_phone || '') + ' ' + (c.seller_email || '')).toLowerCase();

      cards += '<div class="kunde-card" data-suche="' + esc(sucheText) + '">' +
        // Kopf
        '<div class="kc-head">' +
          '<div>' +
            '<div class="kc-company">' + esc(company) + '</div>' +
            '<div class="kc-login"><span class="login-name">' + esc(c.user_login) + '</span> ' + statusTag + '</div>' +
          '</div>' +
          '<div class="kc-head-btns">' +
            '<button type="button" class="btn btn-g btn-sm" onclick="toggleSlotView(\'' + c.id + '\',\'' + esc(c.user_login) + '\')">Slots ansehen</button>' +
            '<button type="button" class="btn btn-dark btn-sm" onclick="toggleEdit(\'' + c.id + '\')">Bearbeiten</button>' +
          '</div>' +
        '</div>' +
        // Meta
        '<div class="kc-meta">' + metaLine + '</div>' +
        // Slot-Einblick (aufklappbar, read-only)
        '<div id="slotview-' + c.id + '" class="slot-view" style="display:none;"></div>' +
        // Kennzahlen
        '<div class="kc-stats">' +
          '<div class="kc-stat"><span class="kc-num">' + c.slots_created + '</span><span class="kc-lbl">Slots</span></div>' +
          '<div class="kc-stat"><span class="kc-num">' + comm + '</span><span class="kc-lbl">Provision</span></div>' +
        '</div>' +
        // Slot-Steuerung
        '<div class="kc-slots">' +
          '<span class="kc-slots-lbl">Slots ändern:</span>' +
          '<input type="number" min="1" max="100" placeholder="Anzahl" id="slotcount-' + c.id + '">' +
          '<button type="button" class="btn btn-g btn-sm" onclick="addSlots(\'' + c.id + '\')">+ Hinzufügen</button>' +
          '<button type="button" class="btn btn-red btn-sm" onclick="removeSlots(\'' + c.id + '\')">− Entfernen</button>' +
        '</div>' +
        // Aufklappbarer Bearbeiten-Bereich
        '<div id="editrow-' + c.id + '" class="edit-panel" style="display:none;">' +
          '<div class="edit-grid">' +
            '<div><label>Firmenname</label><input id="e-company-' + c.id + '" value="' + esc(c.company_name || '') + '"></div>' +
            '<div><label>Ansprechpartner</label><input id="e-contact-' + c.id + '" value="' + esc(c.contact_name || '') + '"></div>' +
            '<div><label>Telefon</label><input id="e-phone-' + c.id + '" value="' + esc(c.contact_phone || '') + '"></div>' +
            '<div><label>E-Mail</label><input id="e-email-' + c.id + '" value="' + esc(c.seller_email || '') + '"></div>' +
            '<div><label>Provision %</label><input id="e-comm-' + c.id + '" value="' + esc(c.commission_pct != null ? c.commission_pct : '') + '"></div>' +
          '</div>' +
          '<div class="edit-actions">' +
            '<button type="button" class="btn btn-g btn-sm" onclick="saveCustomer(\'' + c.id + '\')">Speichern</button>' +
          '</div>' +
          '<div class="edit-sub">' +
            '<label>Passwort zurücksetzen</label>' +
            '<div class="pwreset">' +
              '<input id="e-pw-' + c.id + '" placeholder="neues Passwort">' +
              '<button type="button" class="btn btn-sm" style="background:var(--g2);" onclick="suggestEditPw(\'' + c.id + '\')">Vorschlag</button>' +
              '<button type="button" class="btn btn-dark btn-sm" onclick="resetPw(\'' + c.id + '\')">Setzen</button>' +
            '</div>' +
          '</div>' +
          '<div class="edit-danger">' +
            '<button type="button" class="btn btn-sm" style="background:var(--amber);" onclick="toggleActive(\'' + c.id + '\',' + (!isActive) + ')">' +
              (isActive ? 'Kunde deaktivieren' : 'Kunde aktivieren') + '</button>' +
            '<button type="button" class="btn btn-red btn-sm" onclick="deleteCustomer(\'' + c.id + '\',\'' + esc(c.user_login) + '\')">Endgültig löschen</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    area.innerHTML = '<div class="kunden-liste">' + cards + '</div>';
    filterKunden(); // falls schon ein Suchbegriff aktiv ist
  } catch(e) {
    area.innerHTML = '';
    showMsg('listMsg', 'Verbindungsfehler: ' + e.message, false);
  }
}

// ── Kunden filtern (Suchleiste) ──
function filterKunden() {
  const feld = document.getElementById('kundenSuche');
  const begriff = (feld ? feld.value : '').toLowerCase().trim();
  const karten = document.querySelectorAll('.kunde-card');
  let sichtbar = 0;
  karten.forEach(function(k) {
    const text = k.getAttribute('data-suche') || '';
    const treffer = (begriff === '' || text.indexOf(begriff) !== -1);
    k.style.display = treffer ? '' : 'none';
    if (treffer) sichtbar++;
  });
  const count = document.getElementById('sucheCount');
  if (count) {
    if (begriff === '') count.textContent = karten.length + ' Kunden';
    else count.textContent = sichtbar + ' von ' + karten.length;
  }
}

// ── Slot-Einblick: Slots eines Kunden anzeigen (read-only) ──
function renderFunnel(stats) {
  const s = stats || { gespraeche: 0, leads: 0, abschluesse: 0 };
  return '<div class="funnel">' +
    '<div class="funnel-step"><div class="funnel-num">' + s.gespraeche + '</div><div class="funnel-lbl">Gespräche</div></div>' +
    '<div class="funnel-arrow">→</div>' +
    '<div class="funnel-step"><div class="funnel-num funnel-lead">' + s.leads + '</div><div class="funnel-lbl">Leads</div></div>' +
    '<div class="funnel-arrow">→</div>' +
    '<div class="funnel-step"><div class="funnel-num funnel-deal">' + s.abschluesse + '</div><div class="funnel-lbl">Abschlüsse</div></div>' +
  '</div>';
}

async function toggleSlotView(subId, userLogin) {
  const box = document.getElementById('slotview-' + subId);
  if (!box) return;
  // Zuklappen, wenn schon offen
  if (box.style.display !== 'none' && box.innerHTML.trim() !== '') {
    box.style.display = 'none';
    return;
  }
  box.style.display = 'block';
  box.innerHTML = '<div style="color:var(--mu);font-size:14px;">Lade Slots …</div>';
  try {
    const r = await fetch(API + '/api/cv/me?user=' + encodeURIComponent(userLogin));
    const d = await r.json();
    const slots = (d && d.slots) || [];
    if (slots.length === 0) {
      box.innerHTML = '<div style="color:var(--mu);font-size:14px;">Dieser Kunde hat noch keine Slots.</div>';
      return;
    }
    const statusLabel = function(st) {
      if (st === 'empty') return 'leer';
      if (st === 'active') return 'Bot aktiv';
      if (st === 'analyzing') return 'wird analysiert';
      if (st === 'analyzed') return 'analysiert';
      if (st === 'draft' || st === 'configured') return 'in Einrichtung';
      return st;
    };
    let html = '<div class="sv-edit-bar">' +
      '<a class="btn btn-dark btn-sm" href="cv-dashboard.html?kunde=' + encodeURIComponent(userLogin) + '">✏️ In Kundenansicht öffnen & bearbeiten</a>' +
      '</div>';
    for (const s of slots) {
      const a = s.article;
      let title, sub;
      if (a) {
        title = esc(a.title || 'Artikel');
        const preis = (a.sale_price != null) ? (a.sale_price + ' €') : '—';
        sub = 'Status: ' + esc(statusLabel(s.status)) + ' · Preis: ' + preis;
      } else {
        title = '<span style="color:var(--mu);">Kein Artikel eingerichtet</span>';
        sub = 'Status: ' + esc(statusLabel(s.status));
      }
      // Bei Artikel/Bot: Wissen, Einstellungen, Gespräche anzeigbar
      let slotBtns = '';
      if (a) {
        slotBtns =
          '<button type="button" class="btn btn-g btn-sm" onclick="openKnowledgeModal(\'' + s.id + '\')">🧠 Wissen</button>' +
          '<button type="button" class="btn btn-g btn-sm" onclick="openSettingsModal(\'' + s.id + '\')">⚙️ Einstellungen</button>' +
          '<button type="button" class="btn btn-g btn-sm" onclick="toggleSlotConvs(\'' + s.id + '\')">💬 Gespräche</button>';
      }
      html += '<div class="sv-slot">' +
        '<div class="sv-num">' + (s.slot_number || '?') + '</div>' +
        '<div class="sv-info"><div class="sv-title">' + title + '</div>' +
        '<div class="sv-sub">' + sub + '</div></div>' +
      '</div>' +
      (a ? renderFunnel(s.stats) : '') +
      (slotBtns ? '<div class="sv-actions">' + slotBtns + '</div>' : '') +
      '<div id="slotconv-' + s.id + '" class="slot-conv" style="display:none;"></div>';
    }
    box.innerHTML = html;
  } catch(e) {
    box.innerHTML = '<div style="color:var(--red);font-size:14px;">Fehler beim Laden: ' + esc(e.message) + '</div>';
  }
}

// ── Gespräche eines Slots (admin) ──
const scCache = {};

async function toggleSlotConvs(slotId) {
  const box = document.getElementById('slotconv-' + slotId);
  if (!box) return;
  if (box.style.display !== 'none' && box.innerHTML.trim() !== '') {
    box.style.display = 'none';
    box.innerHTML = '';
    return;
  }
  box.style.display = 'block';
  box.innerHTML = '<div class="sc-empty">Lade Gespräche …</div>';
  try {
    const r = await fetch(API + '/api/cv/slot/' + slotId + '/conversations');
    const d = await r.json();
    const convs = (d && d.conversations) || [];
    scCache[slotId] = convs;
    if (convs.length === 0) {
      box.innerHTML = '<div class="sc-empty">Noch keine Gespräche geführt.</div>';
      return;
    }
    let html = '<div class="sc-box"><div class="sc-count">' + convs.length + ' Gespräch' + (convs.length === 1 ? '' : 'e') + '</div>';
    convs.forEach(function(c, idx) {
      html += '<div class="sc-item" onclick="openConvModal(\'' + slotId + '\',' + idx + ')">' +
        '<div class="sc-buyer">📱 ' + esc(c.buyer_phone || 'Unbekannt') + '</div>' +
        '<div class="sc-meta">' + esc(scFmtDate(c.last_message_at || c.created_at)) + ' · ' + c.message_count + ' Nachrichten</div>' +
        '<div class="sc-badges">' + scBadges(c.events) + '</div>' +
      '</div>';
    });
    html += '</div>';
    box.innerHTML = html;
  } catch(e) {
    box.innerHTML = '<div class="sc-empty" style="color:var(--red);">Fehler: ' + esc(e.message) + '</div>';
  }
}

function scBadges(events) {
  const has = function(t) { return events.indexOf(t) !== -1; };
  const b = [];
  if (has('paid')) b.push('<span class="sc-badge scb-paid">✓ Bezahlt</span>');
  else if (has('deal') || has('agreed')) b.push('<span class="sc-badge scb-deal">Einigung</span>');
  else if (has('hot_lead') || has('contact_added')) b.push('<span class="sc-badge scb-lead">Lead</span>');
  if (has('callback')) b.push('<span class="sc-badge scb-mu">Rückruf</span>');
  if (has('escalated')) b.push('<span class="sc-badge scb-mu">Eskaliert</span>');
  if (has('lost')) b.push('<span class="sc-badge scb-lost">Abgebrochen</span>');
  if (b.length === 0) b.push('<span class="sc-badge scb-mu">Gespräch</span>');
  return b.join('');
}

function scFmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('de-AT') + ' ' + d.toLocaleTimeString('de-AT', {hour:'2-digit', minute:'2-digit'});
  } catch(e) { return ''; }
}

function openConvModal(slotId, idx) {
  const convs = scCache[slotId] || [];
  const c = convs[idx];
  if (!c) return;
  document.getElementById('convModalTitle').innerHTML = '💬 ' + esc(c.buyer_phone || 'Gespräch');
  let html = '<div class="cm-result">' + scBadges(c.events) +
    '<span class="sc-meta">' + esc(scFmtDate(c.last_message_at || c.created_at)) + '</span></div>';
  if (c.messages.length === 0) {
    html += '<div class="sc-empty">Keine Nachrichten in diesem Gespräch.</div>';
  } else {
    c.messages.forEach(function(m) {
      html += '<div class="cm-row ' + m.role + '"><div class="cm-bubble">' + esc(m.text) + '</div></div>';
    });
  }
  document.getElementById('convModalBody').innerHTML = html;
  document.getElementById('convModal').classList.add('open');
}

function closeConvModal() {
  document.getElementById('convModal').classList.remove('open');
}

// ── Wissen anzeigen (read-only) ──
async function openKnowledgeModal(slotId) {
  document.getElementById('convModalTitle').innerHTML = '🧠 Wissen des Bots';
  document.getElementById('convModalBody').innerHTML = '<div class="sc-empty">Lade …</div>';
  document.getElementById('convModal').classList.add('open');
  try {
    const r = await fetch(API + '/api/cv/slot/' + slotId);
    const d = await r.json();
    const a = (d && d.article) || {};
    const an = a.analysis || {};
    const strat = an.bot_strategy || {};
    const esc2 = esc;
    const list = function(arr, fn) {
      if (!arr || !arr.length) return '<div class="kv-empty">—</div>';
      return '<ul class="kv-list">' + arr.map(fn).join('') + '</ul>';
    };
    let html = '';
    html += kvBlock('Artikel', esc2(a.title || '—'));
    html += kvBlock('Produktbeschreibung', esc2(an.summary || '—'));
    html += kvBlock('Zustand', esc2(an.condition || '—'));
    html += kvBlock('Weitere Highlights', list(an.key_facts, function(f){ return '<li>' + esc2(f) + '</li>'; }));
    html += kvBlock('Verkaufsargumente', list(an.selling_points, function(p){ return '<li>' + esc2(p) + '</li>'; }));
    html += kvBlock('Hauptargument für den Preis', esc2(strat.value_argument || '—'));
    html += kvBlock('Umgang mit Einwänden', list(an.likely_objections, function(o){
      return '<li><b>' + esc2(o.objection || '') + '</b><br>→ ' + esc2(o.response || '') + '</li>';
    }));
    html += kvBlock('Verhandlungs-Schritte', list(strat.negotiation_steps, function(s){ return '<li>' + esc2(s) + '</li>'; }));
    document.getElementById('convModalBody').innerHTML = html || '<div class="sc-empty">Noch kein Wissen vorhanden.</div>';
  } catch(e) {
    document.getElementById('convModalBody').innerHTML = '<div class="sc-empty" style="color:var(--red);">Fehler: ' + esc(e.message) + '</div>';
  }
}

// ── Einstellungen anzeigen (read-only) ──
async function openSettingsModal(slotId) {
  document.getElementById('convModalTitle').innerHTML = '⚙️ Einstellungen';
  document.getElementById('convModalBody').innerHTML = '<div class="sc-empty">Lade …</div>';
  document.getElementById('convModal').classList.add('open');
  try {
    const r = await fetch(API + '/api/cv/slot/' + slotId);
    const d = await r.json();
    const s = (d && d.slot) || {};
    const a = (d && d.article) || {};
    const priceVis = a.price_visibility || 'public';
    const visLabel = priceVis === 'on_request' ? 'Auf Anfrage' : 'Öffentlich';
    const availLabel = { available: '🟢 Verfügbar', reserved: '🟡 Reserviert', sold: '🔴 Verkauft' }[a.availability || 'available'] || (a.availability || '—');
    let html = '';
    html += settRow('Slot', 'Nr. ' + esc(s.slot_number || '?'));
    html += settRow('Artikelbezeichnung', esc(a.title || '—'));
    html += settRow('Verkaufspreis', a.sale_price != null ? '€ ' + esc(a.sale_price) : '—');
    html += settRow('Mindestpreis', a.min_price != null ? '€ ' + esc(a.min_price) : '—');
    html += settRow('Preis-Anzeige', visLabel);
    html += settRow('Standort', esc(a.location || '—'));
    html += settRow('Anrede im Bot', a.anrede === 'Du' ? 'Du (locker)' : 'Sie (formell)');
    html += settRow('Anzahlung zur Reservierung', (s.deposit_percent != null ? s.deposit_percent : 10) + ' %');
    html += settRow('WhatsApp-Starttext', esc(a.wa_starttext || '— (Standard)'));
    html += settRow('Call-to-Action', esc(a.cta_text || '— (Standard)'));
    html += settRow('Verfügbarkeit', availLabel);
    document.getElementById('convModalBody').innerHTML = '<div class="sett-table">' + html + '</div>';
  } catch(e) {
    document.getElementById('convModalBody').innerHTML = '<div class="sc-empty" style="color:var(--red);">Fehler: ' + esc(e.message) + '</div>';
  }
}

function kvBlock(label, content) {
  return '<div class="kv-block"><div class="kv-label">' + label + '</div><div class="kv-val">' + content + '</div></div>';
}
function settRow(label, value) {
  return '<div class="sett-row"><div class="sett-label">' + label + '</div><div class="sett-val">' + value + '</div></div>';
}

// ── Slots zuweisen ──
async function addSlots(subId) {
  clearMsg('listMsg');
  const input = document.getElementById('slotcount-' + subId);
  const count = parseInt(input.value, 10);
  if (!count || count < 1) {
    showMsg('listMsg', 'Bitte eine gültige Anzahl angeben.', false);
    return;
  }
  try {
    const r = await fetch(API + '/api/cv/admin/customers/' + subId + '/slots', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ count })
    });
    const d = await r.json();
    if (!r.ok || !d.success) {
      showMsg('listMsg', d.error || 'Slot-Zuweisung fehlgeschlagen.', false);
    } else {
      showMsg('listMsg', '✅ ' + d.added + ' Slot(s) zugewiesen. Gesamt: ' + d.slots_total + '.', true);
      loadCustomers();
    }
  } catch(e) {
    showMsg('listMsg', 'Verbindungsfehler: ' + e.message, false);
  }
}

// ── Slots entfernen (nur leere) ──
async function removeSlots(subId) {
  clearMsg('listMsg');
  const input = document.getElementById('slotcount-' + subId);
  const count = parseInt(input.value, 10);
  if (!count || count < 1) {
    showMsg('listMsg', 'Bitte im Feld eine Anzahl eingeben, die entfernt werden soll.', false);
    return;
  }
  if (!confirm(count + ' leere Slot(s) entfernen? Belegte Slots bleiben erhalten.')) return;
  try {
    const r = await fetch(API + '/api/cv/admin/customers/' + subId + '/slots/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ count })
    });
    const d = await r.json();
    if (!r.ok || !d.success) {
      showMsg('listMsg', d.error || 'Entfernen fehlgeschlagen.', false);
    } else {
      let m = '✅ ' + d.removed + ' Slot(s) entfernt. Gesamt jetzt: ' + d.slots_total + '.';
      if (d.note) m += ' ' + d.note;
      showMsg('listMsg', m, true);
      loadCustomers();
    }
  } catch(e) {
    showMsg('listMsg', 'Verbindungsfehler: ' + e.message, false);
  }
}

// ── Bearbeitungszeile auf-/zuklappen ──
function toggleEdit(subId) {
  const row = document.getElementById('editrow-' + subId);
  if (!row) return;
  row.style.display = (row.style.display === 'none') ? 'block' : 'none';
}

// ── Stammdaten speichern ──
async function saveCustomer(subId) {
  clearMsg('listMsg');
  const body = {
    company_name: document.getElementById('e-company-' + subId).value.trim(),
    contact_name: document.getElementById('e-contact-' + subId).value.trim(),
    contact_phone: document.getElementById('e-phone-' + subId).value.trim(),
    seller_email: document.getElementById('e-email-' + subId).value.trim(),
    commission_pct: document.getElementById('e-comm-' + subId).value.trim()
  };
  try {
    const r = await fetch(API + '/api/cv/admin/customers/' + subId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok || !d.success) {
      showMsg('listMsg', d.error || 'Speichern fehlgeschlagen.', false);
    } else {
      showMsg('listMsg', '✅ Stammdaten gespeichert.', true);
      loadCustomers();
    }
  } catch(e) { showMsg('listMsg', 'Verbindungsfehler: ' + e.message, false); }
}

// ── Passwort-Vorschlag für Bearbeitung ──
function suggestEditPw(subId) {
  const chars = 'abcdefghjkmnpqrstuvwxyz';
  const nums = '23456789';
  const all = chars + chars.toUpperCase() + nums;
  let pw = '';
  for (let i = 0; i < 10; i++) pw += all[Math.floor(Math.random() * all.length)];
  document.getElementById('e-pw-' + subId).value = pw;
}

// ── Passwort zurücksetzen ──
async function resetPw(subId) {
  clearMsg('listMsg');
  const pw = document.getElementById('e-pw-' + subId).value.trim();
  if (!pw || pw.length < 4) {
    showMsg('listMsg', 'Bitte ein Passwort mit mindestens 4 Zeichen eingeben.', false);
    return;
  }
  try {
    const r = await fetch(API + '/api/cv/admin/customers/' + subId + '/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const d = await r.json();
    if (!r.ok || !d.success) {
      showMsg('listMsg', d.error || 'Zurücksetzen fehlgeschlagen.', false);
    } else {
      showMsg('listMsg', '✅ Neues Passwort gesetzt: ' + pw + '  (bitte dem Kunden mitteilen!)', true);
    }
  } catch(e) { showMsg('listMsg', 'Verbindungsfehler: ' + e.message, false); }
}

// ── Kunde aktivieren/deaktivieren ──
async function toggleActive(subId, makeActive) {
  clearMsg('listMsg');
  const wort = makeActive ? 'aktivieren' : 'deaktivieren';
  if (!confirm('Kunde wirklich ' + wort + '? Bei Deaktivierung kann er sich nicht mehr einloggen (Daten bleiben erhalten).')) return;
  try {
    const r = await fetch(API + '/api/cv/admin/customers/' + subId + '/active', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ active: makeActive })
    });
    const d = await r.json();
    if (!r.ok || !d.success) {
      showMsg('listMsg', d.error || 'Aktion fehlgeschlagen.', false);
    } else {
      showMsg('listMsg', '✅ Kunde ' + (makeActive ? 'aktiviert' : 'deaktiviert') + '.', true);
      loadCustomers();
    }
  } catch(e) { showMsg('listMsg', 'Verbindungsfehler: ' + e.message, false); }
}

// ── Kunde endgültig löschen ──
async function deleteCustomer(subId, login) {
  clearMsg('listMsg');
  if (!confirm('Kunde "' + login + '" ENDGÜLTIG löschen?\n\nLogin, Abo und alle Slots werden entfernt. Das kann nicht rückgängig gemacht werden.')) return;
  if (!confirm('Wirklich sicher? Letzte Warnung für "' + login + '".')) return;
  try {
    const r = await fetch(API + '/api/cv/admin/customers/' + subId, { method: 'DELETE' });
    const d = await r.json();
    if (!r.ok || !d.success) {
      showMsg('listMsg', d.error || 'Löschen fehlgeschlagen.', false);
    } else {
      showMsg('listMsg', '✅ Kunde "' + login + '" wurde gelöscht.', true);
      loadCustomers();
    }
  } catch(e) { showMsg('listMsg', 'Verbindungsfehler: ' + e.message, false); }
}
