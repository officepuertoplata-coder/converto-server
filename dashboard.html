<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Converdino – Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --g:#25D366;--g2:#1b4332;--g3:#f0fdf4;
  --bg:#f4f6f4;--card:#fff;--border:#e5e7eb;
  --mu:#6b7280;--txt:#111827;--red:#ef4444;
  --gold:#f59e0b;--blue:#3b82f6;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}

/* NAV */
.nav{background:var(--g2);color:#fff;padding:0 20px;display:flex;align-items:center;height:56px;gap:16px;}
.nav-logo{font-size:1.1rem;font-weight:900;letter-spacing:-.5px;}
.nav-logo span{color:var(--g);}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.nav-phone{font-size:.78rem;opacity:.7;}
.nav-btn{background:rgba(255,255,255,.12);border:none;color:#fff;padding:7px 14px;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.nav-btn:hover{background:rgba(255,255,255,.2);}
.nav-btn.primary{background:var(--g);color:#fff;}

/* MAIN */
.main{max-width:900px;margin:0 auto;padding:24px 16px;}

/* SUBSCRIPTION BANNER */
.sub-banner{background:var(--g2);color:#fff;border-radius:var(--r);padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.sub-info{flex:1;}
.sub-title{font-size:1rem;font-weight:800;margin-bottom:4px;}
.sub-detail{font-size:.78rem;opacity:.7;}
.sub-slots{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:10px 16px;border-radius:10px;}
.sub-slots-num{font-size:1.6rem;font-weight:900;color:var(--g);}
.sub-slots-label{font-size:.72rem;opacity:.8;line-height:1.3;}
.sub-add{background:var(--g);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:.82rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap;}

/* NO SUBSCRIPTION */
.no-sub{background:var(--card);border-radius:var(--r);padding:40px 24px;text-align:center;border:2px dashed var(--border);margin-bottom:24px;}
.no-sub h2{font-size:1.3rem;font-weight:900;margin-bottom:8px;}
.no-sub p{color:var(--mu);font-size:.88rem;margin-bottom:20px;}
.buy-btn{background:var(--g);color:#fff;border:none;padding:16px 32px;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 4px 16px rgba(37,211,102,.3);}

/* SLOT SELECTOR */
.slot-selector{background:var(--card);border-radius:var(--r);padding:24px;margin-bottom:24px;display:none;}
.slot-selector h3{font-size:.95rem;font-weight:800;margin-bottom:16px;}
.slots-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.slot-label{font-size:.85rem;font-weight:700;color:var(--mu);}
.slot-input{width:80px;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:1.1rem;font-weight:800;text-align:center;font-family:'Nunito',sans-serif;}
.slot-input:focus{outline:none;border-color:var(--g);}
.slot-price{font-size:1.2rem;font-weight:900;color:var(--g2);}
.slot-price span{font-size:.75rem;font-weight:600;color:var(--mu);}
.checkout-btn{background:var(--g);color:#fff;border:none;padding:14px 28px;border-radius:10px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 4px 12px rgba(37,211,102,.3);}
.checkout-btn:disabled{opacity:.5;cursor:not-allowed;}

/* SLOTS GRID */
.slots-title{font-size:.82rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}

/* SLOT CARD */
.slot-card{background:var(--card);border-radius:var(--r);border:1.5px solid var(--border);overflow:hidden;transition:box-shadow .2s;}
.slot-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);}
.slot-head{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);}
.slot-num{width:28px;height:28px;border-radius:50%;background:var(--g2);color:#fff;font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.slot-name{font-size:.88rem;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.slot-status{font-size:.65rem;font-weight:800;padding:3px 8px;border-radius:20px;}
.status-empty{background:#f3f4f6;color:var(--mu);}
.status-uploading{background:#fff7ed;color:#92400e;}
.status-analyzing{background:#eff6ff;color:var(--blue);}
.status-active{background:#f0fdf4;color:#15803d;}
.status-paused{background:#fef2f2;color:var(--red);}
.slot-body{padding:14px 16px;}

/* EMPTY SLOT */
.empty-slot{text-align:center;padding:12px 0;}
.empty-slot p{font-size:.8rem;color:var(--mu);margin-bottom:12px;}
.upload-slot-btn{width:100%;padding:11px;background:var(--g2);color:#fff;border:none;border-radius:10px;font-size:.82rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;}
.upload-slot-btn:hover{background:#15803d;}

/* ACTIVE SLOT */
.active-slot .art-title{font-size:.85rem;font-weight:700;margin-bottom:10px;color:var(--g2);}
.asset-row{display:flex;gap:8px;margin-bottom:8px;}
.asset-btn{flex:1;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;background:#fff;font-family:'Nunito',sans-serif;text-align:center;transition:all .15s;}
.asset-btn:hover{border-color:var(--g2);background:var(--g3);}
.asset-btn.wa{border-color:#25D366;color:#15803d;background:#f0fdf4;}
.asset-btn.qr{border-color:var(--blue);color:var(--blue);background:#eff6ff;}
.asset-btn.widget{border-color:var(--gold);color:#92400e;background:#fff7ed;}
.delete-slot-btn{width:100%;padding:8px;background:none;border:1.5px solid #fecaca;border-radius:8px;font-size:.75rem;font-weight:700;cursor:pointer;color:var(--red);font-family:'Nunito',sans-serif;margin-top:8px;}
.delete-slot-btn:hover{background:#fef2f2;}

/* ANALYZING SLOT */
.analyzing-slot{text-align:center;padding:8px 0;}
.analyzing-slot .ring{width:28px;height:28px;border:3px solid #e5e7eb;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 8px;}
.analyzing-slot p{font-size:.78rem;color:var(--blue);font-weight:700;}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:var(--r);padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:1rem;font-weight:900;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--mu);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.7rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.88rem;font-family:'Nunito',sans-serif;}
.field input:focus,.field select:focus{outline:none;border-color:var(--g);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-btn{width:100%;padding:14px;background:var(--g);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;margin-top:8px;}
.modal-btn:disabled{opacity:.5;cursor:not-allowed;}

/* ASSET MODAL */
.asset-section{margin-bottom:20px;}
.asset-section h4{font-size:.75rem;font-weight:800;color:var(--mu);text-transform:uppercase;margin-bottom:8px;}
.asset-link{display:block;padding:10px 12px;background:#f9fafb;border:1.5px solid var(--border);border-radius:8px;font-size:.82rem;word-break:break-all;color:var(--blue);text-decoration:none;margin-bottom:8px;}
.copy-btn{padding:8px 16px;background:var(--g2);color:#fff;border:none;border-radius:8px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.qr-img{width:200px;height:200px;border-radius:10px;border:1.5px solid var(--border);display:block;margin:0 auto;}
.widget-code{background:#1e1e1e;color:#a5f3a0;padding:14px;border-radius:8px;font-family:monospace;font-size:.72rem;overflow-x:auto;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow-y:auto;}

/* MISC */
.loading{text-align:center;padding:60px;color:var(--mu);}
.ring{width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--g2);color:#fff;padding:10px 20px;border-radius:30px;font-size:.85rem;font-weight:700;opacity:0;transition:all .3s;z-index:999;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">Con<span>verdino</span></div>
  <div class="nav-right">
    <span class="nav-phone" id="navPhone"></span>
    <button class="nav-btn" onclick="doLogout()">Ausloggen</button>
  </div>
</nav>

<div class="main">
  <div id="app"><div class="loading"><div class="ring"></div>Lade Dashboard...</div></div>
</div>

<!-- Upload Modal -->
<div id="uploadModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-title">
      📦 Artikel einrichten
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="field">
      <label>Artikelbezeichnung</label>
      <input id="f-title" placeholder="z.B. Peugeot Traveller 2018" type="text">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Verkaufspreis (€)</label>
        <input id="f-price" type="number" placeholder="z.B. 23990">
      </div>
      <div class="field">
        <label>Mindestpreis (€)</label>
        <input id="f-minprice" type="number" placeholder="z.B. 21000">
      </div>
    </div>
    <div class="field">
      <label>Standort</label>
      <input id="f-location" placeholder="z.B. Wien, 1010" type="text">
    </div>
    <div class="field">
      <label>Anrede im Bot</label>
      <select id="f-anrede">
        <option value="Sie">Sie</option>
        <option value="du">Du</option>
      </select>
    </div>
    <div id="uploadErr" style="color:var(--red);font-size:.8rem;margin-top:8px;"></div>
    <button class="modal-btn" id="uploadBtn" onclick="doUpload()">Weiter → Fotos & Dokumente</button>
  </div>
</div>

<!-- Asset Modal -->
<div id="assetModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-title">
      🤖 Bot-Integration
      <button class="modal-close" onclick="closeAssetModal()">✕</button>
    </div>
    <div id="assetContent"></div>
  </div>
</div>

<!-- Buy Modal -->
<div id="buyModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-title">
      🚀 Bot-Slots kaufen
      <button class="modal-close" onclick="closeBuyModal()">✕</button>
    </div>
    <div class="field">
      <label>Anzahl Bot-Slots</label>
      <input id="buy-slots" type="number" min="1" max="500" value="5" oninput="updateBuyPrice()">
    </div>
    <div style="background:var(--g3);border:1.5px solid #86efac;border-radius:10px;padding:16px;margin:12px 0;text-align:center;">
      <div style="font-size:.75rem;color:var(--mu);margin-bottom:4px;">Monatlicher Betrag</div>
      <div id="buy-price" style="font-size:2rem;font-weight:900;color:var(--g2);">€150,00</div>
      <div style="font-size:.72rem;color:var(--mu);">€30 pro Slot · monatlich · automatisch verlängernd</div>
    </div>
    <div class="field">
      <label>Ihre E-Mail (für Stripe)</label>
      <input id="buy-email" type="email" placeholder="email@beispiel.at">
    </div>
    <div id="buyErr" style="color:var(--red);font-size:.8rem;margin-top:8px;"></div>
    <button class="modal-btn" id="buyBtn" onclick="doBuy()">Jetzt abonnieren →</button>
  </div>
</div>

<div id="toast"></div>

<script>
const API = 'https://converto-server-production.up.railway.app';
const KEY = 'converto_auth_v2';
let auth = null, subData = null, activeSlotId = null;

function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }
function esc(s){ return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''; }

// ── AUTH ────────────────────────────────────────────
window.onload = function(){
  try{
    auth = JSON.parse(localStorage.getItem(KEY)||'null');
    if(!auth||!auth.role){ location.href='login.html'; return; }
    const age = Date.now()-new Date(auth.loggedInAt).getTime();
    if(age > 12*60*60*1000){ location.href='login.html'; return; }
  }catch(e){ location.href='login.html'; return; }

  document.getElementById('navPhone').textContent = auth.phone||auth.username||auth.name||'';

  // Prüfe ob gerade ein Abo gekauft wurde
  const params = new URLSearchParams(location.search);
  if(params.get('subscribed')==='1'){ toast('✅ Abo erfolgreich aktiviert!'); window.history.replaceState({},'',' dashboard.html'); }

  loadDashboard();
};

function doLogout(){
  localStorage.removeItem(KEY);
  location.href='login.html';
}

// ── DASHBOARD LADEN ──────────────────────────────────
async function loadDashboard(){
  const phone = auth.phone||auth.username||auth.name||'admin';
  try{
    const phone2 = phone || 'admin';
  const r = await fetch(API+'/api/bot/subscription/'+encodeURIComponent(phone2));
    subData = await r.json();
    render();
  }catch(e){
    document.getElementById('app').innerHTML='<div style="text-align:center;padding:40px;color:var(--red);">Verbindungsfehler: '+esc(e.message)+'</div>';
  }
}

// ── RENDER ────────────────────────────────────────────
function render(){
  const app = document.getElementById('app');
  // DEBUG: log what server returns
  console.log('SERVER RESPONSE:', JSON.stringify(subData));
  const isActive = subData && (subData.active===true || subData.status==='active' || subData.slots_total > 0);
  if(!subData||!isActive){
    app.innerHTML = `
      <div class="no-sub">
        <div style="font-size:3rem;margin-bottom:12px;">🤖</div>
        <h2>Noch kein Abo aktiv</h2>
        <p>Kaufe Bot-Slots um automatisierte WhatsApp-Verkaufsberater einzurichten.</p>
        <button class="buy-btn" onclick="openBuyModal()">Bot-Slots kaufen → ab €30/Monat</button>
      </div>`;
    return;
  }

  const slots = subData.slots||[];
  const periodEnd = subData.current_period_end ? new Date(subData.current_period_end).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';

  let html = `
    <div class="sub-banner">
      <div class="sub-info">
        <div class="sub-title">✅ Abo aktiv</div>
        <div class="sub-detail">Verlängert am ${periodEnd} · ${subData.slots_used||0} von ${subData.slots_total} Slots belegt</div>
      </div>
      <div class="sub-slots">
        <div class="sub-slots-num">${subData.slots_total}</div>
        <div class="sub-slots-label">Bot-Slots<br>gesamt</div>
      </div>
      <button class="sub-add" onclick="openBuyModal()">+ Slots kaufen</button>
    </div>`;

  html += '<div class="slots-title">Meine Bot-Slots</div>';
  html += '<div class="slots-grid">';

  slots.forEach(function(slot, idx){
    html += '<div class="slot-card">';
    html += '<div class="slot-head">';
    html += '<div class="slot-num">'+(idx+1)+'</div>';
    html += '<div class="slot-name">'+(slot.article_title||'Leerer Slot')+'</div>';
    html += '<span class="slot-status status-'+esc(slot.status||'empty')+'">'+(statusLabel(slot.status))+'</span>';
    html += '</div>';
    html += '<div class="slot-body">';

    if(slot.status==='empty'){
      html += '<div class="empty-slot"><p>Kein Artikel eingerichtet</p>';
      html += '<button class="upload-slot-btn" onclick="openUploadModal(\''+slot.id+'\')">📦 Artikel einrichten</button></div>';
    } else if(slot.status==='uploading'||slot.status==='analyzing'){
      html += '<div class="analyzing-slot"><div class="ring"></div><p>Analyse läuft...</p></div>';
    } else if(slot.status==='active'){
      html += '<div class="active-slot">';
      html += '<div class="art-title">'+esc(slot.article_title||'Artikel')+'</div>';
      html += '<div class="asset-row">';
      html += '<button class="asset-btn wa" onclick="showAssets(\''+slot.id+'\',\'wa\')">💬 WA-Link</button>';
      html += '<button class="asset-btn qr" onclick="showAssets(\''+slot.id+'\',\'qr\')">📱 QR-Code</button>';
      html += '<button class="asset-btn widget" onclick="showAssets(\''+slot.id+'\',\'widget\')">🔌 Widget</button>';
      html += '</div>';
      html += '<button class="delete-slot-btn" onclick="deleteSlot(\''+slot.id+'\')">🗑 Artikel löschen</button>';
      html += '</div>';
    } else if(slot.status==='paused'){
      html += '<div style="text-align:center;padding:8px 0;"><p style="font-size:.78rem;color:var(--red);">⏸ Pausiert — Zahlung prüfen</p></div>';
    }

    html += '</div></div>';
  });

  html += '</div>';
  app.innerHTML = html;

  // Auto-refresh wenn Analyse läuft
  var analyzing = slots.some(function(s){ return s.status==='uploading'||s.status==='analyzing'; });
  if(analyzing) setTimeout(loadDashboard, 5000);
}

function statusLabel(s){
  return {empty:'Leer',uploading:'Wird geladen',analyzing:'Analyse...',active:'Aktiv',paused:'Pausiert',inactive:'Inaktiv'}[s]||s;
}

// ── BUY MODAL ────────────────────────────────────────
function openBuyModal(){ document.getElementById('buyModal').style.display='flex'; updateBuyPrice(); }
function closeBuyModal(){ document.getElementById('buyModal').style.display='none'; }

function updateBuyPrice(){
  var slots = parseInt(document.getElementById('buy-slots').value)||1;
  var price = slots * 30;
  document.getElementById('buy-price').textContent = '€'+price.toFixed(2).replace('.',',');
}

async function doBuy(){
  var slots = parseInt(document.getElementById('buy-slots').value)||1;
  var email = document.getElementById('buy-email').value.trim();
  var err = document.getElementById('buyErr');
  var btn = document.getElementById('buyBtn');
  if(slots < 1){ err.textContent='Mindestens 1 Slot'; return; }
  if(!email){ err.textContent='Bitte E-Mail eingeben'; return; }
  err.textContent='';
  btn.disabled=true; btn.textContent='Weiterleitung...';
  try{
    var r = await fetch(API+'/api/bot/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone:auth.phone||auth.username, slots, email, name:auth.name||auth.username})});
    var d = await r.json();
    if(d.url) location.href = d.url;
    else { err.textContent=d.error||'Fehler'; btn.disabled=false; btn.textContent='Jetzt abonnieren →'; }
  }catch(e){ err.textContent=e.message; btn.disabled=false; btn.textContent='Jetzt abonnieren →'; }
}

// ── UPLOAD MODAL ─────────────────────────────────────
function openUploadModal(slotId){
  activeSlotId = slotId;
  document.getElementById('uploadModal').style.display='flex';
  document.getElementById('uploadErr').textContent='';
  document.getElementById('uploadBtn').disabled=false;
  document.getElementById('uploadBtn').textContent='Weiter → Fotos & Dokumente';
}
function closeModal(){ document.getElementById('uploadModal').style.display='none'; }

async function doUpload(){
  var title = document.getElementById('f-title').value.trim();
  var price = document.getElementById('f-price').value;
  var minprice = document.getElementById('f-minprice').value;
  var location = document.getElementById('f-location').value.trim();
  var anrede = document.getElementById('f-anrede').value;
  var err = document.getElementById('uploadErr');
  var btn = document.getElementById('uploadBtn');
  if(!title){ err.textContent='Bitte Artikelbezeichnung eingeben'; return; }
  if(!price||!minprice){ err.textContent='Bitte Preise eingeben'; return; }
  err.textContent='';
  btn.disabled=true; btn.textContent='⏳ Bitte warten...';
  try{
    var r = await fetch(API+'/api/bot/slot/'+activeSlotId+'/upload',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title, sale_price:parseFloat(price), min_price:parseFloat(minprice), location, anrede})});
    var d = await r.json();
    if(!d.success){ err.textContent=d.error||'Fehler'; btn.disabled=false; btn.textContent='Weiter → Fotos & Dokumente'; return; }
    // Weiter zu Upload-Seite
    closeModal();
    location.href = 'upload.html?slot='+activeSlotId+'&session='+d.token+'&article='+d.article_id;
  }catch(e){ err.textContent=e.message; btn.disabled=false; btn.textContent='Weiter → Fotos & Dokumente'; }
}

// ── ASSET MODAL ───────────────────────────────────────
async function showAssets(slotId, tab){
  document.getElementById('assetModal').style.display='flex';
  document.getElementById('assetContent').innerHTML='<div class="loading"><div class="ring"></div></div>';
  try{
    var r = await fetch(API+'/api/bot/slot/'+slotId+'/assets');
    var d = await r.json();
    var html = '';

    // WA Link
    html += '<div class="asset-section">';
    html += '<h4>💬 WhatsApp-Link</h4>';
    html += '<a class="asset-link" href="'+esc(d.wa_link)+'" target="_blank">'+esc(d.wa_link)+'</a>';
    html += '<button class="copy-btn" onclick="copyText(\''+esc(d.wa_link)+'\')">📋 Kopieren</button>';
    html += '</div>';

    // QR Code
    html += '<div class="asset-section">';
    html += '<h4>📱 QR-Code</h4>';
    html += '<img class="qr-img" src="'+esc(d.qr_url)+'" alt="QR Code">';
    html += '<div style="text-align:center;margin-top:10px;">';
    html += '<a href="'+esc(d.qr_url)+'" download="qr-'+esc(d.bot_code)+'.png" class="copy-btn" style="text-decoration:none;display:inline-block;">⬇ QR herunterladen</a>';
    html += '</div></div>';

    // Widget
    html += '<div class="asset-section">';
    html += '<h4>🔌 Widget-Code (für Webseite)</h4>';
    html += '<div class="widget-code">'+esc(d.widget_code)+'</div>';
    html += '<button class="copy-btn" style="margin-top:8px;" onclick="copyText(document.querySelector(\'.widget-code\').textContent)">📋 Code kopieren</button>';
    html += '</div>';

    // Bot-Code
    html += '<div class="asset-section">';
    html += '<h4>🔑 Bot-Code</h4>';
    html += '<div style="font-size:1.4rem;font-weight:900;color:var(--g2);text-align:center;padding:10px;background:var(--g3);border-radius:8px;">'+esc(d.bot_code)+'</div>';
    html += '</div>';

    document.getElementById('assetContent').innerHTML = html;
  }catch(e){ document.getElementById('assetContent').innerHTML='<p style="color:var(--red);">'+esc(e.message)+'</p>'; }
}
function closeAssetModal(){ document.getElementById('assetModal').style.display='none'; }

// ── DELETE SLOT ───────────────────────────────────────
async function deleteSlot(slotId){
  if(!confirm('Artikel aus diesem Slot löschen? Der Bot wird deaktiviert.')) return;
  try{
    var r = await fetch(API+'/api/bot/slot/'+slotId+'/article',{method:'DELETE'});
    var d = await r.json();
    if(d.success){ toast('✓ Artikel gelöscht'); loadDashboard(); }
    else toast('Fehler: '+(d.error||''));
  }catch(e){ toast('Fehler: '+e.message); }
}

function copyText(txt){
  navigator.clipboard.writeText(txt).then(function(){ toast('✓ Kopiert!'); });
}
</script>
